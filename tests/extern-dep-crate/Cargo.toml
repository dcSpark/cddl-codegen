[package]
name = "extern-dep-crate"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same version the generated crates declare: a shared dependency tree with the generated crate
# that references this crate's extern types passes cbor_event Serializer/Deserializer values across
# the boundary, so both sides must resolve the SAME cbor_event.
cbor_event = "3.3.0"
wasm-bindgen = "0.2"
hashlink = "0.12.1"
