[package]
name = "extern-dep-crate"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# dcSpark fork (same rev the generated crates pin): a shared dependency tree with the generated
# crate that references this crate's extern types passes cbor_event Serializer/Deserializer values
# across the boundary, so both sides must resolve the SAME cbor_event. Interim measure — back to a
# crates.io version once the fork upstreams + releases.
cbor_event = { git = "https://github.com/dcSpark/cbor_event", rev = "fda6d75585cc2503374ce53e1dca1cf74ae0e476" }
wasm-bindgen = "0.2"
hashlink = "0.12.1"
