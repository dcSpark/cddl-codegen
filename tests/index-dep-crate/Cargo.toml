[package]
name = "index-dep-crate"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
extern-dep-crate = { path = "../extern-dep-crate" }
# The same version the generated crates declare: shares a dependency tree + cbor_event types with
# the generated crate and extern-dep-crate, so all sides must resolve the SAME cbor_event.
cbor_event = "3.3.0"
