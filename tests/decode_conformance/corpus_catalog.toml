[[row]]
id = "wasm_nested_alias.passthru_map"
axis = "corpus"
example = "nums = [* uint]\npassthru = nums\npassthru_map = { * uint => passthru }\n; passthrough alias to a named MAP: transparent `pub type` in rust, but the wasm alias must point at\n; the map's wrapper struct (`pub type PassthruTags = Tags`), not `for_wasm_member`'s structural\n; `MapU64ToText` name. For a sole-owner shape like `tags` that structural name is itself only a\n; `pub type MapU64ToText = Tags;` alias (wasm_bindgen exports no aliases), and for an anonymous-only\n; shape it may not exist at all (E0425) — pointing straight at the rule wrapper is correct either way.\n; Contrast `passthru` above (a directly-exposable array) which stays transparent (`Vec<u64>`)."
fixture = "wasm_nested_alias"
rule = "passthru_map"
spec = "__probe_holder = [0, passthru_map]\nnums = [* uint]\npassthru = nums\npassthru_map = { * uint => passthru }\n; passthrough alias to a named MAP: transparent `pub type` in rust, but the wasm alias must point at\n; the map's wrapper struct (`pub type PassthruTags = Tags`), not `for_wasm_member`'s structural\n; `MapU64ToText` name. For a sole-owner shape like `tags` that structural name is itself only a\n; `pub type MapU64ToText = Tags;` alias (wasm_bindgen exports no aliases), and for an anonymous-only\n; shape it may not exist at all (E0425) — pointing straight at the rule wrapper is correct either way.\n; Contrast `passthru` above (a directly-exposable array) which stays transparent (`Vec<u64>`)."
mode = "holder"
type_name = "ProbeHolder"

