axis = "corpus"
example = "tagged_ctl_ne = #6.11(int .ne 1)\n; incl / excl: inclusive vs exclusive range spanning both sign domains (uint arm + nint arm live).\ntagged_range_incl = #6.11(-10..10)\ntagged_range_excl = #6.11(-10...10)\n; nint_only: a range entirely in the negative domain — only the nint arm is reachable.\ntagged_range_nint = #6.11(-10...-3)\n; uint_control: a range entirely in the non-negative domain — breadth control; only the uint arm is\n;   reachable, so its 3-tuple shape is exercised independently of the nint arm.\ntagged_range_uint = #6.11(3...10)\n; A group-choice arm holding the tagged constrained int, alongside a text arm: pins that the same\n; 3-tuple shape is emitted for the constrained-int inside a choice arm (a distinct emit site).\ngarm = [ ga: #6.15(-10...-3) // gb: tstr ]\n; A `bytes .cbor (...)` payload wrapping a control-constrained int: the CBORBytes wrapper pushes a\n; StringEncoding expr the same way the tag wrapper pushes its tag-encoding expr, so a member holding\n; one destructures `(a, a_bytes_encoding, a_encoding)` — same E0308 mechanism, distinct wrapper.\ncbor_ctl_ne = bytes .cbor (int .ne 1)\n; holder: embed each rule as a member so it emits a real (de)serialize impl in member position.\nholder = [\n  a: tagged_ctl_ne,\n  b: tagged_range_incl,\n  c: tagged_range_excl,\n  d: tagged_range_nint,\n  e: tagged_range_uint,\n  f: garm,\n  g: cbor_ctl_ne,\n]"
