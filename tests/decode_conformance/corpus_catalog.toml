example = "bounded = [2*5 uint]\n; Embed sites are where occurrence counts are actually enforceable (the top-level rules are\n; transparent Vec aliases with no standalone wire API). Occurrence bounds are LENGTH constraints\n; on the array — they must never be misread as element VALUE bounds (`[+ uint]` once rejected the\n; element value 0, and `[2*5 uint]` rejected element values outside 2..=5, while any length\n; passed). The emit-tests deser-reject cases push each field's length out of bounds."
