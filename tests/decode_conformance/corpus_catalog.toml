example = "maybe_uint = uint / null\nnullable_optional_field = [pre: uint, ? field0: maybe_uint]\n\n; Nullable of a COMPOSITE inner (a named collection / a data-enum), not just a primitive. The wasm\n; boundary must map THROUGH the Option (the inner needs a wrapper conversion): a blanket `.into()`\n; has no `From<Option<Inner>>` and the rust serialize must not double-return `serializer`. These\n; exercise the struct-field, map-value and array-element roles for a composite nullable inner."
