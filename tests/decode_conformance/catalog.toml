[[row]]
id = "value.number.bin"
axis = "feature"
example = "m = [v: 0b1010]"
spec = "m = [v: 0b1010]"
mode = "standalone"
type_name = "M"

[[row.vector]]
hex = "8100"
source = "hand"
expect = "reject"
class = "constraint"
reason = "the value 0 is not the fixed value 0b1010 = 10 — violates `m = [v: 0b1010]`; hand-pinned as the silent-zero trap (a radix-conversion regression that reads `0b1010` as 0 flips exactly this vector; cf. the unwrap_or(0) conversion class in draft/rust-cddl-radix-int-literal-gap.md § post-implementation findings)"
expect_err = "Expected fixed value 10 found 0"

[[row.vector]]
hex = "8102"
source = "hand"
expect = "reject"
class = "constraint"
reason = "the value 2 is `0b10` — a truncated-digit mis-lex of `0b1010` — and is not the fixed value 10 — violates `m = [v: 0b1010]` (digit-boundary guard: rejects any decode that stops lexing binary digits early)"
expect_err = "Expected fixed value 10 found 2"

