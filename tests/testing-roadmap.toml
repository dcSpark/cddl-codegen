eam D3) structurally covers the TOOL-PRODUCT half — fresh standalone crates checked through `default-features = false` shims with no oracle in the graph — and never the fixture-hand-code half, because its profiles deliberately exclude the harness appendages. Machinery on a trigger, not now (the class has exactly the two members, both fixed): a `cargo check --lib`-only cell per spliced-hand-fragment fixture family — lib-only checking keeps dev/oracle deps out of the unification graph, so the fragment must compile on the fixture's own declared features. *Reopening signal:* a third instance — a fixture cell flipped red by a dep-graph or oracle-version change with no edit to the fixture itself, or a reshape delivery's hand-file sweep finding a fragment that compiles only under unification. Measurable by exactly the party who hits it (the tier runner reading the E0277 against an unchanged fixture), on the dimension the cost grows (the count of spliced hand fragments using reshaped-dep surfaces)."
