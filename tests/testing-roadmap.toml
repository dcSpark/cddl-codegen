[[record]]
id = "testing.minted-identifier-spellability-floor-identifier-generator-emits-verbatim"
title = "A minted-identifier spellability floor: every identifier the generator emits verbatim must satisfy `is_spellable_variant_name`'s two string properties, asserted at the emission side rather than per-minter."
legacy_aliases = ["Next work 14"]

[record.payload]
kind = "work"
body_md = '''14. **A minted-identifier spellability floor: every identifier the generator emits verbatim must
    satisfy `is_spellable_variant_name`'s two string properties, asserted at the emission side
    rather than per-minter.** The class this closes: a name-minting path whose output is not a
    spellable Rust identifier ships the bad token to rustfmt, which dies with an error naming its
    own confusion instead of the construct — loud, zero files, and misattributed. Three instances
    on 2026-08-06 alone, each found by hand probing rather than by any gate: fixed float/nint
    choice arms minted `F1.5`/`U-1` (variant idents), the anonymous nested choice minted the RULE
    ident `F1.5OrText` from the same lexemes, and a fixed-text arm camel-cased `"self"` into the
    keyword `Self` — identifier-shaped, still unspellable. The delivered repair guards the two
    arm-naming SEAMS (`reject_unnameable_arm_variant_name`, predicate on the minted string), which
    covers every minter those seams consume — but other emit-verbatim name families (rule idents
    from `combined_name`, field names, wasm wrapper names) have no floor, and absence of a fourth
    instance is currently established by nothing. What to build: a check over the finalized IR's
    emitted-name surface (idents, variant names, field names) that fails naming the MINT SITE when
    a name is unspellable, so the next bad minter is a diagnosed refusal rather than a rustfmt
    autopsy. Enumerate the name families from the IR types (`RustIdent`, `VariantIdent`, field
    name storage) rather than grepping for minters — a negative claim ("no other minter emits bad
    names") needs the registry, not a keyword search. That enumeration is shared surface: the
    remaining pre-registration mint-claim and synthesized-name referenced-but-never-minted (E0425)
    predicates want the same emitted-name registry, so whichever is built first makes the others
    added predicates rather than fresh enumerations. The global `RustStruct` registration seam now
    retains the first owner and rejects a structurally incompatible later owner, but it begins
    only after a claim reaches that seam: it does not recover a semantic claim discarded before
    registration, prove
    an emitted name spellable, retain variant provenance, or prove a referenced name was minted.
    **Activated by B3-024A (2026-08-09):** its synthesized
    fixed-singleton owner is the third minting site and initially deduplicated `true` with
    `#6.7(true)` by `FixedValue` alone, making parse order choose the wrong wire codec. The local
    owner check now keys the complete `RustType` wire shape and rejects authored collisions in both
    source orders. **The finalized-IR registry proposed above would NOT by itself have caught this
    semantic collision:** the faulty dedup discarded the second claim before finalization, leaving
    one unique, spellable `RustIdent`; every reference compiled, but one use got the wrong wire.
    Add a pre-registration mint-claim predicate to the shared registry: every minter records
    `(RustIdent, canonical structural/wire identity, mint site)` before lookup/dedup/insert;
    byte-identical repeat claims are allowed, while two identities claiming one ident fail naming
    both sites. Its acceptance vectors must reverse claimant order and assert emitted wire bytes,
    not merely a duplicate-name diagnostic. Keep the finalized-IR spellability/uniqueness checks as
    separate predicates: they catch bad surviving state, while the claim ledger catches a lossy
    registration seam that erased the evidence.

    **B5-101 authored-variant-claim extension (2026-08-14).** Three review catches show the
    distinction this registry still has to retain. A derived type-choice arm before an explicit
    `@name text` silently made the authored arm `Text2`; an inline/member type choice silently
    suffixed two explicit `@name mainnet` arms; and a count-only reservation let a derived `Name`
    take explicitly reserved `Name2`, leaving a repeated final variant. A finalized-IR uniqueness
    predicate would have caught only the third: both earlier failures finish with distinct,
    spellable names after silently breaking the author's claim. `dsl_position_tests` likewise
    cannot catch any of them — it probes directive placement/effect one cell at a time, not
    cross-arm namespace arbitration or the explicit-versus-derived ordering axis. Extend the
    pre-registration ledger with type-choice variant claims before suffix allocation:
    `(choice context, arm ordinal, source @name, emitted VariantIdent, explicitness)`. Assert that
    every explicit claim either survives under its exact Rust-converted spelling or is rejected
    against another explicit claimant; derived claims alone may choose the first globally free
    suffix, never one reserved by an explicit claim. Exercise named-rule and inline/member choices,
    both explicit/derived orders, camel-case convergence, and an explicit `Name2` reservation. This
    is a provenance predicate over the existing shared registry, not a second directive-position
    sweep or a new name-minter enumeration.

'''
work_state = "ready"
work_intent = "build_system"
work_kind = "missing_system"
risk = "compile_failure"
acceptance_md = '''Complete exactly the operative work, validation, and bounded exclusions stated in testing.minted-identifier-spellability-floor-identifier-generator-emits-verbatim's payload prose; do not widen adjacent future work.
'''
