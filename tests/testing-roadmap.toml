parent_record_id = "testing.duplicates-policy-residuals"
title = "Set-nominalization residuals (Delivery 2 of the set-architecture rethink — `d177516`/`816969f`/`13b63a2`/`7daca67`)."
body_md = '''   - **Set-nominalization residuals (Delivery 2 of the set-architecture rethink —
     `d177516`/`816969f`/`13b63a2`/`7daca67`).** Named, generic-instance, and inline `#6.258` sets
     are now nominal wrapper types owning their `{tag, len, elem}` encodings. Three follow-ups
     outlive the delivery:
'''

[[part]]
part_id = "part-sighting-offline-gate-run-new-class"
parent_record_id = "testing.registry-fetch-transients-nested-cargo-cells"
title = "A sighting under an offline gate run is a NEW class"
body_md = '''  - **A sighting under an offline gate run is a NEW class**, not this one — an offline cell
    cannot hit the registry; investigate it, don't re-ledger it here. Two manual tails are now
  known: `no matching package named <dep>` — a tests/ fixture crate grew a dep outside the
    warm-up manifest; add it to `tests/warmup/Cargo.toml`. The former second tail, `failed to
    download <dep> vX.Y.Z … --offline was specified` from a fresh scratch crate outrunning
    `tests/warmup/Cargo.lock`, was observed on 2026-08-06 for `zerocopy-derive 0.8.56` and is
    retired: each online warm-up now refreshes that gitignored lock before fetching. The same
    signature AFTER a completed refresh/fetch is a new undercoverage class — preserve the full
    log and investigate the omitted consumer or manifest rather than habitually setting
    `CHECK_ONLINE=1` or manually updating a lock.
  Fail-fast discipline is unchanged and general: a failed run plus a one-gate retry is NOT a tier
  pass — fail-fast SKIPS every downstream gate, so a tier-level claim needs the tier re-run (the
  gate cache keeps already-passed cells cheap).
'''

[[part]]
part_id = "part-surfaces-still-online"
parent_record_id = "testing.registry-fetch-transients-nested-cargo-cells"
title = "Surfaces still online"
body_md = '''  - **Surfaces still online**: standalone script/gate runs outside check.ts (a bare
    `bun run verify.ts`, an isolated `cargo test --bin cddl-codegen <gate>` confirm) — prefix
    `CARGO_NET_OFFLINE=true` there after any warm run; the warm-up fetch itself (retried,
    hard-stop before any gate if it can't fetch, `CHECK_ONLINE=1` to opt back into online runs);
    and the shared TS-toolchain install's FIRST run per manifest+lock hash (`npm`, not cargo — an
    `npm ci` under `/.ts-toolchain/` that needs the network once, then serves every
    TypeScript-side leg offline; unprobed against a fully-offline tier run).
'''

[[part]]
part_id = "part-tagged-remedy-spelling-was-imprecise-coords-faithful-coords"
parent_record_id = "testing.rejection-message-s-remedy-string-executable-claim-pin"
title = "A tagged remedy spelling was imprecise (`[#6.5(coords)]` for the faithful `#6.5([coords])`)"
body_md = '''    - A tagged remedy spelling was imprecise (`[#6.5(coords)]` for the faithful `#6.5([coords])`)
      until a pin asserted the printed remedy generates.
'''

[[part]]
part_id = "part-verify-ts-evidence-absorber-stays"
parent_record_id = "testing.registry-fetch-transients-nested-cargo-cells"
title = "verify.ts evidence absorber stays"
body_md = '''  - **verify.ts evidence absorber stays**: a transient null replay would flip a row's
    decode-foreign clause to "FAILED", which `verify_cache_transparency` reads as an A/B
    divergence — absorbed by decodeForeignProbe's regenerate-retry-once (the same retry the mint
    paths carry); the transparency gate is the standing detector if a null-replay class outruns
    the retry.
'''

[[part]]
part_id = "part-what-hand-per-construct-buy-established-escape-produced"
parent_record_id = "testing.container-construct-conceptual-type-visitor-walks-flat-combinatorial"
title = "What one hand cell per construct does not buy, established by the escape that produced this entry."
body_md = '''    - **What one hand cell per construct does not buy, established by the escape that produced this
      entry.** A rest row whose inner types lived in another file scope emitted two unresolved-name
      classes at once: the module's rest accessor returned a wrapper class minted at the crate ROOT
      and imported nowhere, and that root wrapper's own `insert`/`get`/`keys` named the inner types
      bare with no import there either. Every ingredient had a green fixture of its own — rest rows,
      cross-scope references, nested maps — and no cell crossed them, so the wasm crate did not
      compile while every gate stayed green.
'''

[[part]]
part_id = "part-why-parity-gate-cannot-host-generalization"
parent_record_id = "testing.wasm-face-s-door-vocabulary-hand-listed-mechanism"
title = "Why the parity gate cannot host the generalization."
body_md = '''    - **Why the parity gate cannot host the generalization.** `wasm_api_parity` exists to report
      "a rust member with no wasm counterpart", but its rust-side walk reads INHERENT impls only
      (`syn::Item::Impl(im) if im.trait_.is_none()`) and documents the exclusion of trait impls as a
      deliberate structural exemption. Every door member's rust-side home is outside that walk —
      three are trait methods on the generated runtime's `ToCBORBytes`/`Serialize`/`Deserialize`,
      three are backed by serde derives — so each contributes no rust-side row and none can be
      reported missing there. The exemption is right for `From`/`AsRef` and wrong for exactly this
      family, whose members exist ONLY as trait methods on the rust side and ONLY as inherent fns on
      the wasm side. Widening the walk to trait impls would drown the differential in the
      `From`/`AsRef` noise the exemption exists to remove; the generalization wants its own
      mechanism, keyed on the trait set the wasm face promises to mirror.
'''

