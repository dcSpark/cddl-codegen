title = "A refusal's first predicate refused the exact remedy its own message named"
body_md = '''    - A refusal's first predicate refused the exact remedy its own message named
      (`{ * uint => [coords] }` — the registry keeps materialized plain groups, so the lookup
      over-matched).
'''

[[part]]
part_id = "part-remedy-pin-per-message-per-triggering-construct-class"
parent_record_id = "testing.rejection-message-s-remedy-string-executable-claim-pin"
title = "A remedy pin is per message PER TRIGGERING CONSTRUCT CLASS, or the message must name the"
body_md = '''    - A remedy pin is per message PER TRIGGERING CONSTRUCT CLASS, or the message must name the
      boundary itself. This is the half a generates-green vector alone cannot deliver: one message
      reachable from two construct classes can be sound for the class whose vector someone
      hand-picked and dead advice for the other.
'''

[[part]]
part_id = "part-remedy-string-executable-wherever-lives-emitted-message-gets"
parent_record_id = "testing.rejection-message-s-remedy-string-executable-claim-pin"
title = "A remedy string is executable wherever it lives — in an emitted message it gets a pinned"
body_md = '''    - A remedy string is executable wherever it lives — in an emitted message it gets a pinned
      generate leg, in a findings entry it gets executed at pickup.
'''

[[part]]
