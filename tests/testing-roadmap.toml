signature_md = '''Disk-floor refusal or ENOSPC gate death with the same run reporting zero scratch entries removed.
'''
response_md = '''Protect live paths, reclaim only explicit old unreferenced scratch, and rerun the whole tier.
'''
retirement_semantics_md = '''Retire only after that root is delivered and durably proven self-retiring; age sweep alone is insufficient.
'''

