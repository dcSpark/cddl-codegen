[[record]]
id = "testing.documented-failure-shape-exercises-prose-cross-crate-int"
title = "Three documented `--common-import-override` failure shapes still have no standing compile proof."

[record.payload]
kind = "work"
body_md = '''- **Three documented `--common-import-override` failure shapes still have no standing compile
  proof.** The shipped
  `Int`-under-`--common-import-override` coverage proves the positive paths and asserts row-ABSENCE
  on the degraded path, but none of the three failure shapes documented in
  `command_line_flags.mdx`'s `--common-import-override` section is compile-proven by a standing cell:
  (a) the consumer's `_borrowed_key_types_self_check` going RED when the common crate's `Int` lacks
  the demanded flavor (needs a de-flavored fixture variant); (b) the unresolved-import failure when
  the common crate exposes no `Int`/`IntError` (the existence contract's loud half); (c) `E0277` at
  the consumer's own map sites when the override is not a `--workspace-dep` (today only the no-row
  half is asserted, by `int_key_via_common_import_override_sidecar`). The hand-written/generated
  preserve-`Int` mirror drift that formerly shared this record is separately guarded now:
  `preserve_encodings` cross-decodes and byte-compares a non-minimal negative vector between the two
  codecs. '''
signal_md = '''Reopening signal on the axis the cost grows along,
  measurable by the party who has the problem: a consumer hitting any of the three failure shapes and
  reporting that the error they got was not the one the docs describe.
'''
work_state = "armed"
work_intent = "build_system"
work_kind = "missing_system"
risk = "compile_failure"
control_ids = ["testing.guard.documented-failure-shape-exercises-prose-cross-crate-int"]

[record.payload.promotion_trigger]
