# The dep-universe warm-up manifest: the union of every crates-io dependency the generated crates
# (and the tests/ fixture crates) can declare. check.ts's local/full preflight runs one retried
# `cargo fetch` against this manifest, then forces CARGO_NET_OFFLINE=true for every gate, so the
# nested-cargo cells never touch the network (the registry-transient hardening —
# tests/README.md § "Offline-after-warmup").
#
# Maintenance:
#   - Deps the manifest ops can emit are drift-gated: `warmup_manifest_covers_registry_dep_universe`
#     (src/cargo_manifest.rs) fails if an emittable dep is missing here or its spec drifted.
#   - Fixture crates under tests/ are the manual tail: a fixture-only dep missing here fails
#     offline cells loudly with `no matching package named <dep>` — add it below.
#
# This crate is never built — `cargo fetch` only. Its Cargo.lock is transient (gitignored).

[package]
name = "cddl-codegen-dep-warmup"
version = "0.0.0"
edition = "2024"

[dependencies]
# The generated crates declare cbor_event at the version the workspace pins, so this warm-up mirrors
# that spec to satisfy `warmup_manifest_covers_registry_dep_universe` (it compares the emitted dep
# spec) and to pre-fetch the crate for offline nested-cargo cells.
cbor_event = "3.3.0"
hashlink = "0.12.1"
derivative = { version = "2.2.0", features = ["use_core"] }
# These four are emitted with `default-features = false` (the generated rust crate runs its JSON and
# hex deps in alloc mode). This manifest deliberately leaves default features ON and only ADDS the
# emitted features: its job is to pre-fetch a SUPERSET of the dep universe, and disabling defaults
# here could only shrink what `cargo fetch` pulls. `warmup_manifest_covers_registry_dep_universe`
# compares versions and asserts feature CONTAINMENT, so the added names are what it checks.
serde = { version = "1.0", features = ["derive", "alloc"] }
serde_json = { version = "1.0.57", features = ["alloc", "float_roundtrip"] }
schemars = { version = "1.2.1", features = ["derive"] }
# The `hex` KEY takes the `const-hex` PACKAGE in the generated crates, so the warm-up has to name the
# package too — a key-only match would pre-fetch the wrong crate and every offline nested-cargo cell
# would fail resolving `const-hex`. Plain `hex 0.4.3` is still reached offline through the workspace's
# own fetch (the `cddl` oracle depends on it), so nothing here needs to name it.
hex = { package = "const-hex", version = "1.19.1", features = ["alloc", "core-error"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6.5"
