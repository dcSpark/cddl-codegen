name: Linter and unit tests

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build.yml'
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/build.yml'
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"

jobs:
  test:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the toolchain + components from rust-toolchain.toml and sets up
      # cargo caching (wraps Swatinem/rust-cache).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Linter checks
        run: cargo clippy --locked --workspace --all-features --all-targets -- --deny "clippy::all"

      - name: Build
        run: cargo build --locked --workspace --all-features --all-targets

      - name: Test
        run: cargo test --all-features --all-targets

      # Plain `cargo test` catches changed/missing snapshots but not orphaned ones (a `.snap`
      # left behind when a refactor stops generating a file). This rejects those.
      - name: Install cargo-insta
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta

      # Filter must list every snapshot-producing test module, or this would falsely flag the
      # missing module's snapshots as unreferenced.
      - name: Snapshot orphan check
        run: cargo insta test --unreferenced=reject -- snapshot_tests robustness
