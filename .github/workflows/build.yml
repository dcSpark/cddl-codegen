name: Linter and unit tests

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build.yml'
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      # static/ is the hand-written runtime shipped into every generated crate, and examples/
      # (ast_roles) is built by the test job and executed by the drift job — an edit to either
      # can break the suite, so neither may bypass CI.
      - "static/**"
      - "examples/**"
      - "tests/**"
      # Matrix-only edits don't touch tests/**, so without this the drift gate
      # below would never trigger on the change that caused the drift.
      - "cddl-matrix/**"
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/build.yml'
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      # static/ is the hand-written runtime shipped into every generated crate, and examples/
      # (ast_roles) is built by the test job and executed by the drift job — an edit to either
      # can break the suite, so neither may bypass CI.
      - "static/**"
      - "examples/**"
      - "tests/**"
      # Matrix-only edits don't touch tests/**, so without this the drift gate
      # below would never trigger on the change that caused the drift.
      - "cddl-matrix/**"

jobs:
  test:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the toolchain + components from rust-toolchain.toml and sets up
      # cargo caching (wraps Swatinem/rust-cache).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Linter checks
        run: cargo clippy --locked --workspace --all-features --all-targets -- --deny "clippy::all"

      - name: Build
        run: cargo build --locked --workspace --all-features --all-targets

      # wasm_json_roundtrip builds generated bindings with wasm-pack and runs them under node
      # (node is preinstalled on ubuntu-latest; the wasm32 target comes from rust-toolchain.toml).
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Test
        run: cargo test --all-features --all-targets

      # Plain `cargo test` catches changed/missing snapshots but not orphaned ones (a `.snap`
      # left behind when a refactor stops generating a file). This rejects those.
      - name: Install cargo-insta
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta

      # Filter must list every snapshot-producing test module, or this would falsely flag the
      # missing module's snapshots as unreferenced.
      - name: Snapshot orphan check
        run: cargo insta test --unreferenced=reject -- snapshot_tests robustness

  # The cddl-matrix projection scripts keep the committed corpus/robustness fixtures and COVERAGE.md
  # docs in sync with matrix.json. Cheap PR gate: mostly file-reading string-scanners, except
  # project_corpus, which also runs the repo's own AST walker (`cargo run --example ast_roles`) for
  # its role checks. The heavy verify.ts (cargo-check-per-schema) is deliberately NOT run here
  # — see tests/TESTING_ROADMAP.md.
  matrix-drift:
    name: cddl-matrix drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # build_matrix --check: matrix.json matches its authored TOMLs/annotations.
      # project_robustness --check: matrix_{supported,panic}/ fixtures match the support verdict.
      # project_wasm_matrix --check: matrix_wasm/ fixtures match the wasm-ABI cell projection.
      # project_golden_hex --check: golden_hex COVERAGE.md matches tests.rs + the encoding matrix
      #   (its header claims CI drift-gating, so it must actually be gated here).
      # project_corpus: validates the corpus overlay (hard-fails on drift) and rewrites COVERAGE.md.
      - name: Matrix snapshot + fixture drift
        working-directory: cddl-matrix
        run: |
          bun run build_matrix.ts --check
          bun run project_robustness.ts --check
          bun run project_wasm_matrix.ts --check
          bun run project_golden_hex.ts --check
          bun run project_corpus.ts

      # project_corpus's exit code doesn't catch stale *rendered* counts in COVERAGE.md (only overlay
      # drift), so diff the file it just rewrote to catch a doc that wasn't regenerated after a change.
      - name: COVERAGE.md is up to date
        run: git diff --exit-code tests/corpus/COVERAGE.md
