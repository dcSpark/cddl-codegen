# CI POLICY — CI runs EXACTLY `bun run check.ts fast`, nothing else (CI cost: sole maintainer,
# AI-velocity commits — see AGENTS.md "Build & verify"). The fast tier of check.ts's gate registry
# is the single definition of what CI does; this file stays a thin invoker. check.ts's own
# `self_checks` gate FAILS if this workflow grows any other run step or drops the fast invocation,
# so growing CI is a reviewed registry edit (maintainer decision), never a workflow edit.
# The heavy correctness gates (workspace build, full `cargo test`, snapshot orphan check) live in
# the `local` tier — run `bun run check.ts` locally before considering work done.
name: fast checks

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build.yml'
      - "check.ts"
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      # static/ is the hand-written runtime shipped into every generated crate, and examples/
      # (ast_roles) is executed by project_corpus's role checks — an edit to either can break the
      # suite, so neither may bypass CI.
      - "static/**"
      - "examples/**"
      - "tests/**"
      # Matrix-only edits don't touch tests/**, so without this the drift gates in the fast tier
      # would never trigger on the change that caused the drift.
      - "cddl-matrix/**"
      # The docs and the root-level hand docs are SCANNED by two fast-tier gates:
      # `lint_doc_citations` reads every tracked .md/.mdx, and `query_q1_gaps` byte-compares a
      # generated block in docs/docs/current_capacities.mdx. Without these two patterns a doc-only
      # commit triggers no CI at all, so those gates would first go red on the next unrelated push
      # — blind to exactly the commit class they exist to catch.
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/build.yml'
      - "check.ts"
      - "**/Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      # static/ is the hand-written runtime shipped into every generated crate, and examples/
      # (ast_roles) is executed by project_corpus's role checks — an edit to either can break the
      # suite, so neither may bypass CI.
      - "static/**"
      - "examples/**"
      - "tests/**"
      # Matrix-only edits don't touch tests/**, so without this the drift gates in the fast tier
      # would never trigger on the change that caused the drift.
      - "cddl-matrix/**"
      # The docs and the root-level hand docs are SCANNED by two fast-tier gates:
      # `lint_doc_citations` reads every tracked .md/.mdx, and `query_q1_gaps` byte-compares a
      # generated block in docs/docs/current_capacities.mdx. Without these two patterns a doc-only
      # commit triggers no CI at all, so those gates would first go red on the next unrelated push
      # — blind to exactly the commit class they exist to catch.
      - "docs/**"
      - "*.md"

jobs:
  fast:
    name: check.ts fast tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the toolchain + components from rust-toolchain.toml and sets up
      # cargo caching (wraps Swatinem/rust-cache).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: oven-sh/setup-bun@v2

      # The one CI step (enforced by check.ts self_checks meta-3): fmt, clippy, snapshot tests,
      # the self-completeness meta-checks, and the cddl-matrix drift gates.
      - run: bun run check.ts fast
