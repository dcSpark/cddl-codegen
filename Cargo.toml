[package]
name = "cddl-codegen"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dcSpark/cddl-codegen"
keywords = ["cddl", "codegen", "cbor", "wasm"]
description = "Codegen serialization logic for CBOR automatically from a CDDL specification"

[features]
default = ["which-rustfmt"]
# Dynamically discover a `rustfmt` binary using the `which` crate
which-rustfmt = ["which"]

[dependencies]
cbor_event = "2.4.0"
# dcSpark fork pinned to fixes not yet in a crates.io release. Parser (feeds our AST): upstream
# discards all comments (breaking our @name/@newtype/@doc DSL), mis-parses a colon member key `b:`
# as an arrow/type key when a `=>` appears anywhere in the entry, and mis-lexes the RFC 8610 radix
# integer literals (`0x10` dies as "Invalid hexfloat", `0b1010` splits into `0` + identifier;
# draft/rust-cddl-radix-int-literal-gap.md — the fix also tightens adjacent lexing: leading-zero
# decimals like `042` are now parse errors, `1e5` floats now parse). Validator (feeds the
# generated-crate conformance oracle, CDDL_ORACLE_DEP): control ops over a uint target were
# unenforced, a multi-entry group in an array only validated as the sole entry with no occurrence
# (draft/rust-cddl-group-occurrence-array-count-gap.md), and ranges with non-uint endpoints
# (`-10..10`, `0.5..10.5`) blanket-rejected every instance (draft/rust-cddl-float-range-gap.md).
# Move back to a crates.io version once all land in anweiss/cddl + release. See tests/TESTING_ROADMAP.md.
cddl = { git = "https://github.com/dcSpark/cddl", rev = "2c7548e1c90a8b7f1fe18c4123c7e28daea3d1b9" }
clap = { version = "4.5", features = ["derive"] }
# dcSpark fork of codegen based on upstream 0.3.0
codegen = { git = "https://github.com/dcSpark/codegen", branch = "master" }
nom = "8"
pathdiff = "0.2.3"
# Cargo's own SemVer parser/evaluator (cargo-team maintained). Powers the dependency-spec merge in
# `cargo_manifest.rs`: a user's concrete version pin is kept verbatim when it satisfies the tool's
# version requirement (caret semantics), otherwise the tool's floor wins.
semver = "1.0"
# Format-preserving TOML DOM (the crate `cargo add`/`cargo remove` use). Powers the declarative
# Cargo.toml changeset model in `cargo_manifest.rs`: untouched keys/comments/formatting of a
# user-edited manifest survive regeneration byte-for-byte. `default-features` keeps `parse`+`display`.
toml_edit = "0.25"
# default-features=false to drop the optional `regex` dep; `real-sys` (the actual lookup impl) is
# off by default in which 8, so enable it explicitly.
which = { version = "8", optional = true, default-features = false, features = ["real-sys"] }

[dev-dependencies]
# golden snapshot tests of generated output (see tests/*/snapshots/)
insta = "1.48"
# Harness-side ONLY (never a generated-crate dep): the decode-side reference-codec differential in
# `ir_conformance_corpus` decodes our minted bytes through TWO independent CBOR codecs and asserts
# they agree structurally — a CDDL-blind well-formedness check the two spec validators don't perform.
# `minicbor` is used nowhere else in the pipeline (that's its decorrelation value); `ciborium` is
# otherwise only reachable inside the `cddl` validator's process, here we drive it directly.
ciborium = "0.2"
# `half` gates the `decode::Tokenizer` + `data::Token` stream API the differential drives.
minicbor = { version = "0.26", features = ["half"] }
# Harness-side ONLY (never a generated-crate dep): `decode_conformance_replay` parses the committed
# `tests/decode_conformance/catalog.toml` corpus (same class as ciborium/minicbor above). Navigated
# via `toml::Value` — no serde derives of our own.
toml = "0.8"