[package]
name = "cddl-codegen"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dcSpark/cddl-codegen"
keywords = ["cddl", "codegen", "cbor", "wasm"]
description = "Codegen serialization logic for CBOR automatically from a CDDL specification"

[features]
default = ["which-rustfmt"]
# Dynamically discover a `rustfmt` binary using the `which` crate
which-rustfmt = ["which"]

[dependencies]
cbor_event = "2.4.0"
# we don't update due to https://github.com/anweiss/cddl/issues/222
cddl = "=0.9.1"
clap = { version = "4.5", features = ["derive"] }
codegen = { git = "https://github.com/dcSpark/codegen", branch = "master" }
# nom kept on 7.x: nom 8 requires rewriting every `combinator(input)` call to `.parse(input)`
# across the comment-DSL parser for no functional gain. `cargo update` tracks the latest 7.x.
nom = "7.1.3"
pathdiff = "0.2.3"
# default-features=false to drop the optional `regex` dep; `real-sys` (the actual lookup impl) is
# off by default in which 8, so enable it explicitly.
which = { version = "8", optional = true, default-features = false, features = ["real-sys"] }
# Not used directly: declared so the `codegen` dep's `syn` (pinned to 1.x) gets the `full` feature
# via normal-dep unification. Edition 2024 defaults to the v2 feature resolver, which (unlike v1)
# no longer leaks `full` in from proc-macro deps, so `codegen`'s syn parser panics without this.
# Must match codegen's syn major version (1.x); revisit when codegen moves to syn 2.x.
syn = { version = "1", features = ["full"] }

[dev-dependencies]
# golden snapshot tests of generated output (see tests/*/snapshots/)
insta = "1.48"