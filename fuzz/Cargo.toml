[package]
name = "cddl-codegen-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The crates under test are GENERATED (gitignored): run ./generate.sh first. Both generated crates
# are the `cddl-lib` package, so the recursive one is renamed to avoid the collision.
cddl-lib = { path = "generated/rust" }
recursive_lib = { package = "cddl-lib-recursive", path = "generated/recursive/rust" }

[[bin]]
name = "from_cbor_bytes"
path = "fuzz_targets/from_cbor_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "from_cbor_bytes_recursive"
path = "fuzz_targets/from_cbor_bytes_recursive.rs"
test = false
doc = false
bench = false

[workspace]
