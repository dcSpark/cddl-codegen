# dcSpark fork pinned to the `float-round-trip` branch head (same rev the MAIN crate's Cargo.toml
# pins): adds the width-preserving `float_sz`/`write_float_sz` API and rejects reserved simple
# values `0xfc-0xfe` at read. Generated crates need it once they carry the `AnyCbor` runtime type
# (loose CBOR parsing), whose float slot is `Float(f64, Option<Sz>)`. Interim measure — move this
# back to a crates.io version `set` once the fork upstreams to primetype/cbor_event + releases.
# NOTE for that flip: merge_dep_spec treats a version-only `set` as a floor that PRESERVES an
# existing git source on already-written manifests — the flip must also clear `git`/`rev` (see
# the source-assertion contract in src/cargo_manifest.rs).
[[change]]
id = 7
path = "dependencies.cbor_event"
set = '{ git = "https://github.com/dcSpark/cbor_event", rev = "fda6d75585cc2503374ce53e1dca1cf74ae0e476" }'

# The generated crate's `std` feature: default-ON and emitted UNCONDITIONALLY, so every crate this
# tool writes has the same manifest shape and a plain `cargo build` is unchanged. It gates the few
# genuinely-std pieces of the runtime from inside the crate; a no_std consumer depends on the crate
# with `default-features = false`.
#
# The `[]` below is only the BASE. `ops_for_rust` overrides `features.std` every run with a COMPUTED
# list: `<pkg>/std` for each `--std-forward-dep` path dependency, then for each third-party dep this
# flag set ships in alloc mode and which has a `std` feature to name (`serde`, `serde_json`,
# `schemars`, `hex`). A per-run computed op can do what a static log entry could not — the run that
# emits a manifest knows every dep it wrote, so it never names an absent one. `hashlink` and the
# pinned `cbor_event` fork declare no `std` feature at all, so nothing forwards to them.
#
# `features.default` and `features.std` are the two NON-dependency paths `apply` merges instead of
# replacing (union, the user's entries first), so a hand-customized list keeps its entries and gains
# ours. `features.std` additionally PRUNES any `<pkg>/<feat>` entry whose `<pkg>` is not in
# `[dependencies]` when the op applies — the tool's std list varies with the flags, so a flag flip
# would otherwise strand yesterday's forward beside a tombstoned dep, which cargo rejects.
#
# The `default` union is monotone — `"std"` cannot be durably removed there, which is exactly why the
# supported no_std path is `default-features = false` at the DEPENDANT rather than an edit to it.
[[change]]
id = 8
path = "features.default"
set = '["std"]'

[[change]]
id = 9
path = "features.std"
set = '[]'

# Re-pin to the current `float-round-trip` branch head. A rev is only a usable pin while it is
# reachable from a remote branch: entry 7's rev was never on the remote, so a fresh checkout of a
# manifest carrying it cannot resolve the dep at all. This rev ("Fix handling of float heads") is
# the published branch head and carries the float surface the runtime reads against —
# `se::smallest_float_sz`, `se::f64_to_f32_exact`, `se::f32_to_f64_exact`, `float_sz`/
# `write_float_sz`. Same interim posture as entry 7: back to a crates.io version `set` (clearing
# `git`/`rev`, per the source-assertion contract in `src/cargo_manifest.rs`) once the fork
# upstreams to primetype/cbor_event and releases.
[[change]]
id = 10
path = "dependencies.cbor_event"
set = '{ git = "https://github.com/dcSpark/cbor_event", rev = "28514916e97240e1d2b01ba8f804d45c221fbdcd" }'
