[[change]]
id = 9
path = "dependencies.cbor_event"
set = '"3.2.0"'

# dcSpark fork pinned to the `float-round-trip` branch head ("Fix handling of float heads", same
# rev the MAIN crate's Cargo.toml pins): adds the width-preserving `float_sz`/`write_float_sz` API
# and rejects reserved simple values `0xfc-0xfe` at read. Generated crates need it once they carry
# the `AnyCbor` runtime type (loose CBOR parsing), whose float slot is `Float(f64, Option<Sz>)`.
# Every manifest this tool writes must name ONE cbor_event rev: the generated crates pass
# `Serializer`/`Deserializer` values across their boundaries, so a skew between the rust and wasm
# pins is a type mismatch. Interim measure — move this back to a crates.io version `set` once the
# fork upstreams to primetype/cbor_event + releases.
# NOTE for that flip: merge_dep_spec treats a version-only `set` as a floor that PRESERVES an
# existing git source on already-written manifests — the flip must also clear `git`/`rev` (see
# the source-assertion contract in src/cargo_manifest.rs).
# (Corrected in place 2026-08-03: the rev this entry originally set was never reachable from any
# remote — a fresh checkout could not resolve it. See README "Correcting a never-valid value";
# the `pin_cold_fetch` gate now proves every mentioned rev against its remote.)
[[change]]
id = 10
path = "dependencies.cbor_event"
set = '{ git = "https://github.com/dcSpark/cbor_event", rev = "28514916e97240e1d2b01ba8f804d45c221fbdcd" }'

# No wasm source has ever named this crate: the wasm crate reaches tables only through the rust
# crate's re-exported `OrderedHashMap`, so entry 8 was already vestigial. The rust crate's backing
# has since moved to `hashlink` — which the wasm crate equally does not name — so the entry goes
# rather than being re-pointed.
[[change]]
id = 11
path = "dependencies.linked-hash-map"
remove = true

# Back to a crates.io version, which is what entry 10 called an interim measure: `cbor_event 3.3.0`
# (released 2026-08-03) publishes the fork's `float-round-trip` head — its `src/` is byte-identical
# to rev `28514916…`. The one-rev rule entry 10 states is unchanged and now trivially met: rust,
# wasm and the static runtime all name the same registry version, so the `Serializer`/`Deserializer`
# values crossing their boundaries stay one type.
# `assert_source` is load-bearing, not decoration: a version-only `set` is a FLOOR, so without it
# `merge_dep_spec` would preserve the `{ git, rev }` entry already written into every consumer
# manifest and the flip would land only on fresh output. See the source-assertion contract in
# src/cargo_manifest.rs.
[[change]]
id = 12
path = "dependencies.cbor_event"
set = '"3.3.0"'
assert_source = true
