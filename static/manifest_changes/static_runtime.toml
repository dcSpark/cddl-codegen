# Append-only change log for the `--export-static-crate` target's `Cargo.toml`.
# APPEND-ONLY: never edit, delete, or renumber an existing entry — change = append (last write
# wins), removal = append `remove = true`. Format and rules: README.md in this folder.
#
# Unlike the three generated-crate logs, this manifest is CO-OWNED: the target is a hand-owned
# crate (e.g. CML's cml-core) that the tool contributes only the runtime source files and their
# required dependency versions to. Hence package identity is `seed` (only a fresh crate gets it;
# an existing crate's name/version/edition are never touched), and only the dependencies the
# exported source unconditionally references are `set` here. Flag-conditional runtime deps live in
# `ops_for_static_runtime` (src/cargo_manifest.rs) — and, deviating from the generated-crate
# set-or-remove rule, they are set-or-SKIP: the tool cannot know a dep it no longer needs isn't
# still needed by the crate's hand code, so it never removes a dep from a co-owned manifest.

[[change]]
id = 1
path = "package.name"
seed = '"cddl-runtime"'

[[change]]
id = 2
path = "package.version"
seed = '"0.1.0"'

[[change]]
id = 3
path = "package.edition"
seed = '"2024"'

[[change]]
id = 4
path = "dependencies.cbor_event"
set = '"3.2.0"'

[[change]]
id = 5
path = "dependencies.hex"
set = '"0.4.3"'

# dcSpark fork pinned to the `float-round-trip` branch head (same rev the MAIN crate's Cargo.toml
# pins): adds the width-preserving `float_sz`/`write_float_sz` API and rejects reserved simple
# values `0xfc-0xfe` at read. The exported static runtime carries the `AnyCbor` type (loose CBOR
# parsing), whose float slot is `Float(f64, Option<Sz>)`. Interim measure — move this back to a
# crates.io version `set` once the fork upstreams to primetype/cbor_event + releases. (Co-owned
# manifest: this dep is asserted, never removed.)
# NOTE for that flip: merge_dep_spec treats a version-only `set` as a floor that PRESERVES an
# existing git source on already-written manifests — the flip must also clear `git`/`rev` (see
# the source-assertion contract in src/cargo_manifest.rs).
[[change]]
id = 6
path = "dependencies.cbor_event"
set = '{ git = "https://github.com/dcSpark/cbor_event", rev = "e2bca6d257f70ab0c226c4efd0726d3f5c1b4490" }'

# The `std` feature, uniform with the generated rust crate's (see `rust.toml`'s entry for the full
# contract). ASSERTED here for a reason that is not uniformity: `ordered_hash_map.rs` is one file
# with two destinations — it is composed into the generated crate AND exported into this co-owned
# crate — and it now selects its hash builder on `#[cfg(feature = "std")]`. An UNDECLARED feature is
# always false, so shipping that cfg without this declaration would silently move every
# static-crate consumer off std's `RandomState` (seeded SipHash) onto the backing map's default
# hasher. The declaration and the cfg are therefore one change, not two.
#
# Scope of what this buys: an IN-CRATE switch only. Unlike the generated rust crate's, this
# manifest's dependency specs are NOT reshaped to alloc mode (co-owned — a dep's std-ness is the
# owning crate's business), so declaring `std` here does not by itself make the crate buildable with
# `--no-default-features`.
#
# Same co-owned posture as the deps above: `features.default` merges as a union, so a hand-written
# default list keeps its entries and gains `"std"`.
[[change]]
id = 7
path = "features.default"
set = '["std"]'

[[change]]
id = 8
path = "features.std"
set = '[]'
