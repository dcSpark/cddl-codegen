# Containment — role.occurrence-target × feature. The entry an occurrence indicator (?, *, +, n*m)
# applies to. Schema = containment/type2.toml (id, role, feature, spec, note) PLUS an `example`
# parsed by the oracles to corroborate `spec`. An occurrence applies to a whole grpent, so it can
# repeat a composite entry (occurrence-of-composite). Grammar anchor: grpent = [occur S] [memberkey S] type
# / [occur S] "(" S group S ")".

[[contain]]
id = "contain.occurrence-target.type2.map"
role = "role.occurrence-target"
feature = "type2.map"
spec = "allowed"
note = "An occurrence repeating an INLINE map entry. Unsupported: an inline map in a position requiring a TYPE is not a table, and there is no anonymous representation for it — cddl-codegen rejects it gracefully and names the supported spelling (hoist it to its own rule and reference it). Distinct from the anonymous-ARRAY class, which is a separate site keyed on the bracket. RFC8610 §3.2, §3.5."
example = "a = [* {x: int, y: uint}]"

[[contain]]
id = "contain.occurrence-target.type2.array"
role = "role.occurrence-target"
feature = "type2.array"
spec = "allowed"
note = "Occurrence over an array entry: `[* [int]]` (a variable-length list of arrays). RFC8610 §3.2, §3.4; ABNF grpent [occur] ... type2 array."
example = "a = [* [int]]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "One occurrence applies to a whole parenthesized sub-group, repeating the entire entry tuple: `[* (int, tstr)]`. RFC8610 §3.2, §2.2; ABNF grpent / [occur] inline-group."
example = "a = [* (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.plus_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A one-or-more occurrence on an inline array group repeats the tuple. The generator should reject rather than silently narrowing the group to exactly once; supporting this requires real Vec-of-synthesized-group support. RFC8610 §3.2, §3.4."
example = "a = [+ (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.optional_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "An optional occurrence on an inline array group permits the tuple to be absent. The generator should reject rather than silently narrowing the group to exactly once. RFC8610 §3.2, §3.4."
example = "a = [? (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.bounded_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A bounded occurrence on an inline array group repeats the tuple. The generator should reject rather than silently narrowing the group to exactly once. RFC8610 §3.2, §3.4."
example = "a = [2*5 (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.exactly_once_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "An exactly-once occurrence on an inline array group has exactly the same semantics as flattening the group once, so flattening is sound. RFC8610 §3.2, §3.4."
example = "a = [1*1 (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.zero_map"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A zero-permitting occurrence on an inline map group permits the keyed entry to be absent. The generator should reject rather than silently narrowing it to mandatory; supporting this requires real Option-style support for zero-permitting map markers. RFC8610 §3.2, §3.5."
example = "a = { * (k: int) }"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.plus_map"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A one-or-more occurrence on an inline map group collapses to mandatory under unique map keys, so flattening to one keyed field is sound. RFC8610 §3.2, §3.5."
example = "a = { + (k: int) }"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.table_map"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A zero-or-more occurrence on a parenthesized table entry remains a table (`BTreeMap`) rather than a zero-permitting struct field. RFC8610 §3.2, §3.5.2."
example = "a = { * (int => tstr) }"

[[contain]]
id = "contain.occurrence-target.memberkey.bareword.zero_map"
role = "role.occurrence-target"
feature = "memberkey.bareword"
spec = "allowed"
note = "A zero-permitting occurrence on a keyed struct-map field permits the entry to be absent. The generator should reject gracefully rather than silently narrowing it to mandatory; `?` is the supported optional spelling. RFC8610 §3.2, §3.5.1."
example = "plain = { * t: uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.bareword.zero_bounded_map"
role = "role.occurrence-target"
feature = "memberkey.bareword"
spec = "allowed"
note = "A bounded occurrence with lower bound zero on a keyed struct-map field permits absence. The generator should reject gracefully rather than silently narrowing it to mandatory. RFC8610 §3.2, §3.5.1."
example = "multi = { a: uint, 0*1 b: uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.plus_table"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "A one-or-more occurrence on a NON-literal (type-domain) arrow map entry: `{ + tstr => uint }` requires 1..N entries (RFC8610 §3.2 `+` = one-or-more, §3.5.2 admits a type1 key). Home here because the varying axis is the occurrence MARKER on the arrow entry (its no-occurrence sibling `contain.map-key.memberkey.type1.tstr_arrow_nooccur` lives in map-key.toml because ITS axis was the key spelling). cddl-codegen honors the `+` lower bound as a NonEmptyMap<String, u64> whose single TryFrom door rejects the empty map, so the row's decode-catalog empty-map vector (holder `[0, {}]` = `8200a0`) is a class=\"constraint\" enforcement reject pin (`enforce = yes`); the unbounded upper direction matches the spec. Enumerated with its boundary-violation vector per the 'Intra-alternative variation rows' rule. Provenance + the remaining bounded-cardinality candidate: cddl-matrix/ROADMAP.md § findings, the 'Real bounded `?` / `n*m` table cardinality is a candidate feature' entry."
example = "m = { + tstr => uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.optional_table"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "An optional occurrence on a type-domain arrow map entry: `{ ? tstr => uint }` permits 0..1 entries (RFC8610 §3.2 `?` = optional, §3.5.2). cddl-codegen REJECTS this spelling gracefully — the count-permitting table-marker boundary: a 0..1 window an unbounded BTreeMap table cannot honor, so rejection replaced the old silent widening — making this a reject fixture (`tests/matrix_reject/`), not a decode-catalog row. The rust oracle formerly ALSO over-rejected the spec-VALID empty map here (README gap #9, fixed in the pinned fork @ 3d56d8e), so if the marker is ever honored as map-size bounds, the legal empty-map accept vector (`8200a0`) is now mintable through the two-oracle gate."
example = "m = { ? tstr => uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.bounded_table"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "A bounded occurrence on a type-domain arrow map entry: `{ 2*3 tstr => uint }` requires 2..3 entries (RFC8610 §3.2 `n*m`, §3.5.2). cddl-codegen REJECTS this spelling gracefully — a bounded window that neither an unbounded BTreeMap table nor a NonEmptyMap can honor, the same count-permitting table-marker boundary as the `?` sibling — so this is a reject fixture (`tests/matrix_reject/`), not a decode-catalog row. Real bounded table cardinality is the ledgered candidate feature: cddl-matrix/ROADMAP.md § findings, the 'Real bounded `?` / `n*m` table cardinality is a candidate feature' entry."
example = "m = { 2*3 tstr => uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_struct"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "The open struct-map: a `*`-occurrence type-domain arrow entry (`* K => V`) that is the FINAL row of a map with >=1 fixed key before it (`{ 1: uint, * uint => any }`). Home here because the varying axis is the occurrence MARKER on the arrow rest row (the `*` targets `uint => any`); its count-permitting sibling `contain.occurrence-target.memberkey.type1.open_struct_plus` pins the rejected `+` boundary. cddl-codegen recognizes the trailing `* K => V` after fixed keys as a REST ROW and CAPTURES unknown entries into a `rest` field — container by mode: BTreeMap non-preserve, OrderedHashMap under --preserve-encodings (byte-exact incl. wire-order interleave + canonical merge), Vec<(K, V)> PairMap twin under `@duplicates preserve` — instead of table-detecting to a plain table or rejecting the mixed struct+table shape (the old `mixed struct+table maps unsupported` posture is retired). v1 key domains are uint/text/any (the range type is unrestricted); flattened JSON, a read-only wasm `rest()` accessor, and opaque extern projection all land. Distinct from the plain table `{ * K => V }` (feature type2.map, table-style) which carries no fixed keys: the composition (>=1 fixed key + trailing rest row) is what this cell pins, and it FLIPS the plain-table `+` verdict at the sibling (a `+` lone table is a NonEmptyMap; a `+` rest row is rejected). Doc: output_format.mdx section 'Open struct-maps (rest rows)'. RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 '=>'."
example = "m = { 1: uint, * uint => any }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_struct_plus"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "The count-permitting boundary of the open struct-map: a `+` (one-or-more) occurrence on the type-domain arrow REST row after fixed keys (`{ 1: uint, + uint => any }`). Spec-legal (RFC8610 §3.2 `+`, §3.5.2 admits a type1 key), but cddl-codegen REJECTS it gracefully — open-struct capture is unbounded-`*`-only, so `+`, `n*m`, and `?` on a rest row are refused with a message naming the supported `* k => v` spelling — making this a reject fixture (tests/matrix_reject/), not a decode-catalog row. Contrast the sibling `contain.occurrence-target.memberkey.type1.plus_table` (`{ + tstr => uint }`, no fixed key), where the SAME `+` marker IS supported as a NonEmptyMap: the composition (a `+` REST row after fixed keys vs a `+` on a lone table) flips the verdict — the (feature x context) distinction this matrix exists to record. Pinned loud by `open_struct_map_rest_row_front_end` (robustness_tests.rs). RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 '=>'."
example = "m = { 1: uint, + uint => any }"

# The rest row's KEY-DOMAIN axis. The two cells above vary the occurrence MARKER over one fixed key
# domain (`uint`); these five vary the DOMAIN at a fixed `*` marker. The axis matters because the
# generator's boundary sits here and nowhere else: any deserializable key type is accepted, and the
# two exclusions are type-level properties of `K` (a float anywhere inside it, a `null` arm anywhere
# inside it) rather than properties of the marker or the composition. Modelled as cells so a matrix
# consumer can ASK which key domains a rest row admits, mirroring how the float TABLE-key boundary is
# already cell-pinned (`contain.map-key.memberkey.type1.float_arrow_single` and its siblings).
# Regression defense lives generator-side (`tests/open-struct-map-typed/`, the `open-struct-map-*` e2e
# vectors, and the two rejection guards in `open_struct_map_rest_row_front_end`); these rows add
# model-completeness, not a second defense.

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_struct_named_key"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "A rest row whose key domain is a NAMED RULE (`m = { 1: uint, * k => any }`, `k = uint / text`) rather than the bare `uint` of `contain.occurrence-target.memberkey.type1.open_struct`. Supported: a nominal `K` takes the seek path — the loop hoists a `raw.position()` anchor, the declared-key match arms rewind to it when they decline, and `K::deserialize` then reads the key itself, so the write and read halves are the SAME `K` codec by construction rather than a peeked head and a separate writer. A union `K` is the interesting nominal shape because each of its arms must leave the declared keys reachable; declared keys peel first and never reach `K::deserialize`. RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 '=>'."
example = "m = { 1: uint, * k => any }\nk = uint / text"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_struct_bytes_key"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "A rest row whose key domain is `bytes` (`m = { 1: uint, * bytes => any }`) — supported, capturing into a `BTreeMap<Vec<u8>, _>`. The byte-string domain is the sidecar-bearing member of this family: under `--preserve-encodings` a `bytes` key contributes a `StringEncoding` bound by the key's own deserialize rather than by a peek, which is the concrete reason a rest key's codec has to be symmetric rather than head-peeked. Its JSON face is a pure error surface (a byte string has no member-name image), so the row also marks where the flattened-rest JSON convention stops. RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 '=>'."
example = "m = { 1: uint, * bytes => any }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_struct_nint_key"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "A rest row whose key domain is `nint` (`m = { 1: uint, * nint => any }`) — supported. The sign axis of the integer key domain: the captured keys land on CBOR major 1 while the map's own declared key `1` sits on major 0, so the row's key dispatch separates them by wire major before any rewind is needed. Named beside the named-rule and `bytes` siblings because the delivered boundary is 'any deserializable non-float, non-null-admitting `K`', and an enumeration that showed only `uint`-shaped domains would understate it. RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 '=>'."
example = "m = { 1: uint, * nint => any }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_struct_float_key"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "The FLOAT boundary of the rest row's key domain (`m = { 1: uint, * float => any }`). Spec-legal (RFC8610 §3.5.2 admits any type1 as a member key), but cddl-codegen REJECTS it gracefully, naming the rule and the reason: floats have no total order, so they cannot key the capture container. The guard is transitive — it walks the domain, so a struct or union with a float ANYWHERE inside it (`k = [x: float64, y: uint]`) is refused on the same message — which is why one cell covers the whole float-containing class rather than one per nesting depth. This is a reject fixture (tests/matrix_reject/), not a decode-catalog row. The same boundary in the TABLE-key position is `contain.map-key.memberkey.type1.float_arrow_single` and its siblings; pinned by `open_struct_map_rest_row_front_end` (robustness_tests.rs). RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 '=>'."
example = "m = { 1: uint, * float => any }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_struct_null_key"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "The NULL-ADMITTING boundary of the rest row's key domain (`m = { 1: uint, * k => any }`, `k = text / null`). Spec-legal, but cddl-codegen REJECTS it gracefully: a `null` key and the `break` that ends an indefinite-length map are both CBOR major-7 specials, so the row's key dispatch cannot tell 'another captured entry keyed null' from 'the map ended' — the refusal names that collision and points at dropping the `null` arm, since an absent entry already means absent. The rejection is about the key domain ADMITTING null, not about it being exactly `null`: the arm is refused wherever it sits in `K`. Distinct from the float boundary next to it (`contain.occurrence-target.memberkey.type1.open_struct_float_key`), whose reason is ordering rather than wire ambiguity — two independent exclusions, hence two cells. Reject fixture (tests/matrix_reject/), not a decode-catalog row; pinned by `open_struct_map_rest_row_front_end` (robustness_tests.rs). RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 '=>'."
example = "m = { 1: uint, * k => any }\nk = text / null"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_table"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "The open table: a map of exactly TWO `*`-occurrence type-domain arrow entries and no fixed key (`t = { * bstr => uint, * uint => uint }`). Home here beside `contain.occurrence-target.memberkey.type1.open_struct` because the varying axis is again the occurrence MARKER on an arrow row — what differs is the COMPOSITION, two marked rows rather than fixed keys plus one. cddl-codegen lowers it to a Record with zero fixed fields and two capture containers, routed by CBOR WIRE MAJOR TYPE peeked before any deserializer runs: the typed (first) row claims exactly its key\'s single statically-known major, the catch-all (last) row sees only the complement, and a key of the typed row\'s major that the row\'s own type refuses is a HARD parse error rather than a capture. `K_t`\'s major must be statically knowable — a primitive, an alias of one, a raw-bytes marker or an alias of one, a `.size`-constrained bytes, or a tagged type; a key whose wire a `@custom_serialize`/`@custom_deserialize` pair owns declares it with `@custom_wire_major` (dsl.custom_wire_major). Both rows carry their own `@duplicates` policy, container spelling and encoding sidecars; under --preserve-encodings the two dynamic sequences share ONE order vector through a tagged slot encoding, and --canonical-form merges both regions into one sort by encoded key bytes. NAMED rules only: an inline anonymous spelling, a group-choice arm, a plain group, >2 non-fixed rows, and two rows mixed with fixed keys are each a graceful rejection naming the supported form. Doc: output_format.mdx section \'Open tables (a typed row plus a catch-all)\', comment_dsl.mdx section \'Open tables\'. RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 \'=>\'."
example = "t = { * bstr => uint, * uint => uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_table_plus"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "The count-permitting boundary of the open table, and the one place in this family where a `+` on an arrow row is SUPPORTED after being rejected at its two siblings: a one-or-more occurrence on an open table\'s TYPED row (`t = { + bstr => uint, * uint => uint }`) is the NonEmpty twin, whose minimum of 1 counts TYPED entries only — a map of purely captured entries is not a non-empty table. cddl-codegen enforces it at two doors: `new(first_key, first_value)` (so no constructed value violates it) and one check after each reader\'s loop, raising the same RangeCheck `NonEmptyMap`\'s own door raises. `+` and `1*` are one spelling, `*` and `0*` another; every other marker is a real bounded cardinality and is refused rather than widened. Contrast `contain.occurrence-target.memberkey.type1.open_struct_plus` (a `+` REST row after fixed keys, rejected) and `contain.occurrence-target.memberkey.type1.plus_table` (a `+` on a lone table, a NonEmptyMap): three contexts, the same marker, three different verdicts — the (feature x context) distinction this matrix exists to record. Pinned by `open_table_front_end` (robustness_tests.rs) and executed in tests/open-table-e2e. RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 \'=>\'."
example = "t = { + bstr => uint, * uint => uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.open_table_catchall_plus"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "The other side of the open table\'s count-permitting boundary: a one-or-more occurrence on the CATCH-ALL row (`t = { * bstr => uint, + uint => uint }`). Spec-legal (RFC8610 §3.2 `+`, §3.5.2 admits a type1 key), but cddl-codegen REJECTS it gracefully — the open table\'s min-1 counts TYPED entries, so on the catch-all it would demand at least one entry the rule says nothing about — making this a reject fixture (tests/matrix_reject/), not a decode-catalog row. It is the cell that keeps `contain.occurrence-target.memberkey.type1.open_table_plus` from reading as \'`+` is fine on an open table\': the marker\'s verdict flips between the two ROWS of one rule. Pinned by `open_table_front_end` (robustness_tests.rs). RFC8610 §3.2, §3.5.2; ABNF grpent [occur] ... memberkey type1 \'=>\'."
example = "t = { * bstr => uint, + uint => uint }"

[[contain]]
id = "contain.occurrence-target.grpent.member.zero_array"
role = "role.occurrence-target"
feature = "grpent.member"
spec = "allowed"
note = "A FINAL-position zero-or-more occurrence on a bare-type entry in a HETEROGENEOUS array is an open-array rest tail: the fixed prefix is read positionally, then the `* t` tail captures the remaining elements into a `Vec<T>` (the array analogue of the open struct-map rest row). Non-final `*`, `+`/`n*m`, and fixed-value tails stay rejected gracefully. Single-entry forms (`[* bytes]`) take the homogeneous Vec path. Under --preserve-encodings each captured tail element re-serializes byte-exactly via a positional per-element encoding sidecar (a self-carried `any` element needs none), and --canonical-form normalizes non-minimal widths in position order (no sort — arrays are positional); the captured `Vec<T>` renders as an ordinary JSON array field (skip-if-empty on write, default-on-read) and exposes a read-only wasm `rest()` list-wrapper getter. RFC8610 §3.2, §3.4."
example = "a = [uint, * bytes]"

[[contain]]
id = "contain.occurrence-target.grpent.member.plus_array"
role = "role.occurrence-target"
feature = "grpent.member"
spec = "allowed"
note = "A FINAL-position one-or-more occurrence on a bare-type entry in a HETEROGENEOUS array is a restricted open-array rest tail: the fixed prefix is read positionally, then the `+ t` / `1* t` tail captures the remaining elements in `NonEmptyVec<T>`. Its `new` door takes the first tail element, and CBOR/JSON staged reads enter the same TryFrom door so zero elements reject with the min-one RangeCheck. Preserve/canonical retain the positional encoding contract; JSON is a required minItems-one array; wasm and component project the first-element constructor input plus a restricted-list getter. Non-final, multiple, bounded and fixed/plain-group tail forms remain graceful rejections. RFC8610 §3.2, §3.4."
example = "a = [uint, + bytes]"

[[contain]]
id = "contain.occurrence-target.grpent.groupname"
role = "role.occurrence-target"
feature = "grpent.groupname"
spec = "allowed"
note = "A zero-or-more occurrence can target a named group reference; naming the group is the supported workaround for repeated tuple groups and pins the sole-use plain-group registration path. RFC8610 §2.2.1, §3.2."
example = "a = [* pair]\npair = (int, tstr)"

[[contain]]
id = "contain.occurrence-target.grpent.groupname.table_map"
role = "role.occurrence-target"
feature = "grpent.groupname"
spec = "allowed"
note = "A zero-or-more occurrence can target a named group reference in map representation; this probes the named-group map occupant rather than an inline table. RFC8610 §2.2.1, §3.2, §3.5."
example = "m = { * grp }\ngrp = (k: int)"

# Fixed values under an occurrence marker — the CARDINALITY axis of fixed-value member containment.
# The six rows below are the two SIDES of one boundary (count-permitting vs exactly-once/keyed), in
# both the array and map representations; each note names its opposite side, because a row set that
# records only the refused side does not show a boundary. Their exactly-once array sibling lives in
# array-element.toml (`contain.array-element.type2.value.bare_exactly_once`).

[[contain]]
id = "contain.occurrence-target.type2.value.zero_array"
role = "role.occurrence-target"
feature = "type2.value"
spec = "allowed"
note = "A zero-or-more occurrence targeting a BARE (unkeyed) fixed value as an array element: `[* 5]` repeats a literal, not a type. The count-permitting side of the fixed-value cardinality boundary; its exactly-once side is `contain.array-element.type2.value.bare_exactly_once` (`[5, x: uint]`) and its keyed count-permitting siblings are `contain.occurrence-target.type2.value.optional_keyed_array` / `.optional_keyed_map`. RFC8610 §3.2, §3.4, §2.1; ABNF grpent = [occur S] type -> type2 value."
example = "a = [* 5]"

[[contain]]
id = "contain.occurrence-target.type2.value.optional_array"
role = "role.occurrence-target"
feature = "type2.value"
spec = "allowed"
note = "An optional occurrence targeting a bare fixed value as an array element: `[? 5]` admits zero or one literal. Same count-permitting side as `contain.occurrence-target.type2.value.zero_array` / `.plus_array`, varying only the marker; the exactly-once side is `contain.array-element.type2.value.bare_exactly_once` and the KEYED optional counterpart is `contain.occurrence-target.type2.value.optional_keyed_array`. RFC8610 §3.2, §3.4, §2.1; ABNF grpent = [occur S] type -> type2 value."
example = "a = [? 5]"

[[contain]]
id = "contain.occurrence-target.type2.value.plus_array"
role = "role.occurrence-target"
feature = "type2.value"
spec = "allowed"
note = "A one-or-more occurrence targeting a bare fixed value as an array element: `[+ 5]` admits one or more repetitions of a literal. Completes the marker sweep over the count-permitting side beside `contain.occurrence-target.type2.value.zero_array` / `.optional_array`; the exactly-once side is `contain.array-element.type2.value.bare_exactly_once`. RFC8610 §3.2, §3.4, §2.1; ABNF grpent = [occur S] type -> type2 value."
example = "a = [+ 5]"

[[contain]]
id = "contain.occurrence-target.type2.value.table_map"
role = "role.occurrence-target"
feature = "type2.value"
spec = "allowed"
note = "The MAP-representation sibling of the bare-fixed-value occurrence rows: a `*` occurrence on a type-domain arrow entry whose VALUE domain is a literal (`{ * uint => 5 }`), so the repeated payload per table entry is a fixed value. The keyed side of the same boundary in map representation is `contain.occurrence-target.type2.value.optional_keyed_map`; the array-representation count-permitting sibling is `.zero_array`. RFC8610 §3.2, §3.5.2, §2.1; ABNF grpent = [occur S] memberkey type -> type2 value."
example = "m = { * uint => 5 }"

[[contain]]
id = "contain.occurrence-target.type2.value.optional_keyed_map"
role = "role.occurrence-target"
feature = "type2.value"
spec = "allowed"
note = "The KEYED side of the fixed-value cardinality boundary in map representation: an optional occurrence on a member whose key is a bareword and whose value is a literal (`{ ? k: 5, j: uint }`), so the cardinality lives on a named entry rather than on a table row. Its bare/table counterpart is `contain.occurrence-target.type2.value.table_map` (`{ * uint => 5 }`) and its array-representation twin is `.optional_keyed_array`; the same shape appears in `tests/corpus/optional_fixed_member.cddl` (`opt_fixed_map`). Two-field example to match the shape convention of the sibling `role.map-value` rows. RFC8610 §3.2, §3.5.1, §2.1; ABNF grpent = [occur S] memberkey S type."
example = "m = { ? k: 5, j: uint }"

[[contain]]
id = "contain.occurrence-target.type2.value.optional_keyed_array"
role = "role.occurrence-target"
feature = "type2.value"
spec = "allowed"
note = "The KEYED side of the fixed-value cardinality boundary in array representation: an optional occurrence on a LABELLED array member whose type is a literal (`[x: uint, ? v: 5, label: tstr]`). Its bare counterpart is `contain.occurrence-target.type2.value.optional_array` (`[? 5]`) and its map twin is `.optional_keyed_map`. The trailing `label: tstr` is deliberate: an array optional whose CBOR major type overlaps the FOLLOWING field trips the ambiguity guard documented in `tests/corpus/optional_fixed_member.cddl`, so a Text-classed successor to the Uint-classed optional keeps this cell on the fixed-value-under-occurrence axis rather than on the guard. RFC8610 §3.2, §3.4, §2.1; ABNF grpent = [occur S] memberkey S type."
example = "a = [x: uint, ? v: 5, label: tstr]"
