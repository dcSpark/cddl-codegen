# Containment — role.occurrence-target × feature. The entry an occurrence indicator (?, *, +, n*m)
# applies to. Schema = containment/type2.toml (id, role, feature, spec, note) PLUS an `example`
# parsed by the oracles to corroborate `spec`. An occurrence applies to a whole grpent, so it can
# repeat a composite entry (occurrence-of-composite). Grammar anchor: grpent = [occur S] [memberkey S] type
# / [occur S] "(" S group S ")".

[[contain]]
id = "contain.occurrence-target.type2.map"
role = "role.occurrence-target"
feature = "type2.map"
spec = "allowed"
note = "An occurrence repeating an INLINE map entry. Unsupported: an anonymous nested composite must be named (parsing.rs 'Anonymous groups not allowed') — works via a named-type reference. RFC8610 §3.2, §3.5. (2-field map, so the panic is the anonymous-group limit, not the single-field-map bug.)"
example = "a = [* {x: int, y: uint}]"

[[contain]]
id = "contain.occurrence-target.type2.array"
role = "role.occurrence-target"
feature = "type2.array"
spec = "allowed"
note = "Occurrence over an array entry: `[* [int]]` (a variable-length list of arrays). RFC8610 §3.2, §3.4; ABNF grpent [occur] ... type2 array."
example = "a = [* [int]]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "One occurrence applies to a whole parenthesized sub-group, repeating the entire entry tuple: `[* (int, tstr)]`. RFC8610 §3.2, §2.2; ABNF grpent / [occur] inline-group."
example = "a = [* (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.plus_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A one-or-more occurrence on an inline array group repeats the tuple. The generator should reject rather than silently narrowing the group to exactly once; supporting this requires real Vec-of-synthesized-group support. RFC8610 §3.2, §3.4."
example = "a = [+ (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.optional_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "An optional occurrence on an inline array group permits the tuple to be absent. The generator should reject rather than silently narrowing the group to exactly once. RFC8610 §3.2, §3.4."
example = "a = [? (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.bounded_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A bounded occurrence on an inline array group repeats the tuple. The generator should reject rather than silently narrowing the group to exactly once. RFC8610 §3.2, §3.4."
example = "a = [2*5 (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.exactly_once_array"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "An exactly-once occurrence on an inline array group has exactly the same semantics as flattening the group once, so flattening is sound. RFC8610 §3.2, §3.4."
example = "a = [1*1 (int, tstr)]"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.zero_map"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A zero-permitting occurrence on an inline map group permits the keyed entry to be absent. The generator should reject rather than silently narrowing it to mandatory; supporting this requires real Option-style support for zero-permitting map markers. RFC8610 §3.2, §3.5."
example = "a = { * (k: int) }"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.plus_map"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A one-or-more occurrence on an inline map group collapses to mandatory under unique map keys, so flattening to one keyed field is sound. RFC8610 §3.2, §3.5."
example = "a = { + (k: int) }"

[[contain]]
id = "contain.occurrence-target.grpent.inline_group.table_map"
role = "role.occurrence-target"
feature = "grpent.inline_group"
spec = "allowed"
note = "A zero-or-more occurrence on a parenthesized table entry remains a table (`BTreeMap`) rather than a zero-permitting struct field. RFC8610 §3.2, §3.5.2."
example = "a = { * (int => tstr) }"

[[contain]]
id = "contain.occurrence-target.memberkey.bareword.zero_map"
role = "role.occurrence-target"
feature = "memberkey.bareword"
spec = "allowed"
note = "A zero-permitting occurrence on a keyed struct-map field permits the entry to be absent. The generator should reject gracefully rather than silently narrowing it to mandatory; `?` is the supported optional spelling. RFC8610 §3.2, §3.5.1."
example = "plain = { * t: uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.bareword.zero_bounded_map"
role = "role.occurrence-target"
feature = "memberkey.bareword"
spec = "allowed"
note = "A bounded occurrence with lower bound zero on a keyed struct-map field permits absence. The generator should reject gracefully rather than silently narrowing it to mandatory. RFC8610 §3.2, §3.5.1."
example = "multi = { a: uint, 0*1 b: uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.plus_table"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "A one-or-more occurrence on a NON-literal (type-domain) arrow map entry: `{ + tstr => uint }` requires 1..N entries (RFC8610 §3.2 `+` = one-or-more, §3.5.2 admits a type1 key). Home here because the varying axis is the occurrence MARKER on the arrow entry (its no-occurrence sibling `contain.map-key.memberkey.type1.tstr_arrow_nooccur` lives in map-key.toml because ITS axis was the key spelling). cddl-codegen honors the `+` lower bound as a NonEmptyMap<String, u64> whose single TryFrom door rejects the empty map, so the row's decode-catalog empty-map vector (holder `[0, {}]` = `8200a0`) is a class=\"constraint\" enforcement reject pin (`enforce = yes`); the unbounded upper direction matches the spec. Enumerated with its boundary-violation vector per the 'Intra-alternative variation rows' rule. Provenance + the remaining bounded-cardinality candidate: cddl-matrix/ROADMAP.md § findings, the 'Real bounded `?` / `n*m` table cardinality is a candidate feature' entry."
example = "m = { + tstr => uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.optional_table"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "An optional occurrence on a type-domain arrow map entry: `{ ? tstr => uint }` permits 0..1 entries (RFC8610 §3.2 `?` = optional, §3.5.2). cddl-codegen REJECTS this spelling gracefully — the count-permitting table-marker boundary: a 0..1 window an unbounded BTreeMap table cannot honor, so rejection replaced the old silent widening — making this a reject fixture (`tests/matrix_reject/`), not a decode-catalog row. The rust oracle formerly ALSO over-rejected the spec-VALID empty map here (README gap #9, fixed in the pinned fork @ 3d56d8e), so if the marker is ever honored as map-size bounds, the legal empty-map accept vector (`8200a0`) is now mintable through the two-oracle gate."
example = "m = { ? tstr => uint }"

[[contain]]
id = "contain.occurrence-target.memberkey.type1.bounded_table"
role = "role.occurrence-target"
feature = "memberkey.type1"
spec = "allowed"
note = "A bounded occurrence on a type-domain arrow map entry: `{ 2*3 tstr => uint }` requires 2..3 entries (RFC8610 §3.2 `n*m`, §3.5.2). cddl-codegen REJECTS this spelling gracefully — a bounded window that neither an unbounded BTreeMap table nor a NonEmptyMap can honor, the same count-permitting table-marker boundary as the `?` sibling — so this is a reject fixture (`tests/matrix_reject/`), not a decode-catalog row. Real bounded table cardinality is the ledgered candidate feature: cddl-matrix/ROADMAP.md § findings, the 'Real bounded `?` / `n*m` table cardinality is a candidate feature' entry."
example = "m = { 2*3 tstr => uint }"

[[contain]]
id = "contain.occurrence-target.grpent.member.zero_array"
role = "role.occurrence-target"
feature = "grpent.member"
spec = "allowed"
note = "A zero-or-more occurrence on a bare-type entry in a HETEROGENEOUS array admits any repetition count of that item. The generator rejects gracefully rather than silently narrowing it to a single mandatory item (the array analogue of the keyed-map cells above). Single-entry forms (`[* bytes]`) take the homogeneous Vec path and are supported. RFC8610 §3.2, §3.4."
example = "a = [uint, * bytes]"

[[contain]]
id = "contain.occurrence-target.grpent.member.plus_array"
role = "role.occurrence-target"
feature = "grpent.member"
spec = "allowed"
note = "A one-or-more occurrence on a bare-type entry in a heterogeneous array: unlike the keyed-map `+` (which collapses to mandatory under unique keys), array repetitions are real items, so the generator rejects gracefully rather than narrowing to exactly-once. RFC8610 §3.2, §3.4."
example = "a = [uint, + bytes]"

[[contain]]
id = "contain.occurrence-target.grpent.groupname"
role = "role.occurrence-target"
feature = "grpent.groupname"
spec = "allowed"
note = "A zero-or-more occurrence can target a named group reference; naming the group is the supported workaround for repeated tuple groups and pins the sole-use plain-group registration path. RFC8610 §2.2.1, §3.2."
example = "a = [* pair]\npair = (int, tstr)"

[[contain]]
id = "contain.occurrence-target.grpent.groupname.table_map"
role = "role.occurrence-target"
feature = "grpent.groupname"
spec = "allowed"
note = "A zero-or-more occurrence can target a named group reference in map representation; this probes the named-group map occupant rather than an inline table. RFC8610 §2.2.1, §3.2, §3.5."
example = "m = { * grp }\ngrp = (k: int)"
