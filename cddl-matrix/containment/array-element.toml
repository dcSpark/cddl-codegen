# Containment — role.array-element × feature. Nestings inside `[ ... ]` (an array's group entry).
# Schema per [[contain]] matches containment/type2.toml (id, role, feature, spec, note) PLUS an
# `example`: a minimal CDDL snippet isolating the nesting, parsed by the spec-validity oracles to
# corroborate `spec`. spec = "allowed" | "disallowed" per the ABNF (RFC 9682 grammar / RFC 8610).
# id = "contain.<role-id-tail>.<feature-id>". Trivial primitive-as-element cells are omitted as a
# redundant code path; only the structurally interesting (composite / choice / unwrap / group) cells
# are recorded. Grammar anchor: type2 array -> "[" group "]" -> grpchoice -> grpent.

[[contain]]
id = "contain.array-element.type.choice"
role = "role.array-element"
feature = "type.choice"
spec = "allowed"
note = "An array entry is a `type` (grpent member), and `type` is a `/` type-choice, so a choice may be an element directly. RFC8610 §3.4, §2.2.2; ABNF type2 array -> grpent -> type (type-choice)."
example = "a = [int / tstr]"

[[contain]]
id = "contain.array-element.type2.unwrap"
role = "role.array-element"
feature = "type2.unwrap"
spec = "allowed"
note = "`~name` is a type2, valid wherever a type is; as an array element it inlines the unwrapped type's content. RFC8610 §3.4, §3.7; ABNF grpent -> type -> type2 unwrap."
example = "h = [uint]\na = [~h]"

[[contain]]
id = "contain.array-element.type2.map"
role = "role.array-element"
feature = "type2.map"
spec = "allowed"
note = "An INLINE map as an array element. Unsupported: an inline map in a position requiring a TYPE is not a table, and there is no anonymous representation for it — cddl-codegen rejects it gracefully and names the supported spelling (hoist it to its own rule and reference it). Distinct from the anonymous-ARRAY class, which is a separate site keyed on the bracket. RFC8610 §3.4, §3.5."
example = "a = [{x: int, y: uint}]"

[[contain]]
id = "contain.array-element.type2.array"
role = "role.array-element"
feature = "type2.array"
spec = "allowed"
note = "An array is a type2, valid as an array element (array of arrays). RFC8610 §3.4; ABNF grpent -> type -> type2 array."
example = "a = [[int]]"

[[contain]]
id = "contain.array-element.grpent.inline_group"
role = "role.array-element"
feature = "grpent.inline_group"
spec = "allowed"
note = "A parenthesized inline group is itself a grpent, so a sub-group may appear directly among an array's entries (group-in-group). RFC8610 §2.2; ABNF grpent / inline-group."
example = "a = [(int, tstr)]"

[[contain]]
id = "contain.array-element.grpent.groupname"
role = "role.array-element"
feature = "grpent.groupname"
spec = "allowed"
note = "A group entry may be a groupname reference, splicing that named group's entries into the array. RFC8610 §2.2.1; ABNF grpent / groupname."
example = "a = [pt]\npt = (uint, uint)"

# Literal values as array-element MEMBERS — supported, unlike a top-level `version = 5` type (which
# panics). Normally a primitive-as-element cell is omitted as trivial; here the (feature × role) support
# DIFFERS from the per-feature (top-level) verdict, which is exactly the interesting case to record.
[[contain]]
id = "contain.array-element.value.number"
role = "role.array-element"
feature = "value.number"
spec = "allowed"
note = "A numeric literal as a fixed array-element value (`[v: 5]`) — supported as a member; the top-level `version = 5` type is not. RFC8610 §2.1, §3.4."
example = "a = [v: 5]"

[[contain]]
id = "contain.array-element.value.text"
role = "role.array-element"
feature = "value.text"
spec = "allowed"
note = "A text literal as a fixed array-element value (`[v: \"x\"]`) — supported as a member; the top-level `marker = \"x\"` type is not. RFC8610 §2.1, §3.4."
example = "a = [v: \"x\"]"

[[contain]]
id = "contain.array-element.prelude.true"
role = "role.array-element"
feature = "prelude.true"
spec = "allowed"
note = "The prelude constant `true` as a fixed array-element member value (`[v: true]`) — supported as a member; the top-level `foo = true` type is not. RFC8610 §2.1, §3.4."
example = "a = [v: true, x: uint]"

[[contain]]
id = "contain.array-element.prelude.null"
role = "role.array-element"
feature = "prelude.null"
spec = "allowed"
note = "The prelude constant `null` as a fixed array-element member value (`[v: null]`) — distinct from the choice-member nullable pattern. RFC8610 §2.1, §3.4."
example = "a = [v: null, x: uint]"

[[contain]]
id = "contain.array-element.type2.value"
role = "role.array-element"
feature = "type2.value"
spec = "allowed"
note = "A literal value as a member type (`[w: uint, v: 5]`) — supported in-composite; the standalone `answer = 42` type is not. RFC8610 §2.1, §3.4."
example = "a = [w: uint, v: 5]"

[[contain]]
id = "contain.array-element.type2.tag.fixed_null"
role = "role.array-element"
feature = "type2.tag"
spec = "allowed"
note = "A tag wrapping a fixed null member value (`[v: #6.1(null)]`) — covers the member-position wrapped fixed-value arm, including preserve-encoding emission. RFC8610 §3.4, §3.6."
example = "a = [v: #6.1(null), x: uint]"

[[contain]]
id = "contain.array-element.type2.tag.fixed_bool"
role = "role.array-element"
feature = "type2.tag"
spec = "allowed"
note = "A tag wrapping a fixed bool member value (`[v: #6.11(true)]`) — covers the member-position wrapped fixed-value arm with a non-null prelude constant. RFC8610 §3.4, §3.6."
example = "a = [v: #6.11(true), x: uint]"

# Fixed-value member enumeration, continued: the remaining prelude constant, the bytes literal kind,
# and the BARE (unkeyed) exactly-once placement. The bare row is the exactly-once side of the
# cardinality boundary whose count-permitting side lives in occurrence-target.toml
# (`contain.occurrence-target.type2.value.{zero,optional,plus}_array`).

[[contain]]
id = "contain.array-element.prelude.false"
role = "role.array-element"
feature = "prelude.false"
spec = "allowed"
note = "The prelude constant `false` as a fixed array-element member value (`[v: false, x: uint]`) — the third of the three fixed prelude constants in this role, beside `contain.array-element.prelude.true` and `.null`, and the array-representation twin of `contain.map-value.prelude.false`. RFC8610 §2.1, §3.4."
example = "a = [v: false, x: uint]"

[[contain]]
id = "contain.array-element.prelude.undefined"
role = "role.array-element"
feature = "prelude.undefined"
spec = "allowed"
note = "The prelude constant `undefined` as a fixed array-element member value (`[v: undefined, x: uint]`) — the fourth fixed prelude constant in this role, completing the sweep beside `contain.array-element.prelude.true` / `.null` / `.false`. Its map-representation twin is `contain.map-value.prelude.undefined`. RFC8610 §2.1, §3.4."
example = "a = [v: undefined, x: uint]"

[[contain]]
id = "contain.array-element.value.bytes"
role = "role.array-element"
feature = "value.bytes"
spec = "allowed"
note = "A byte-string literal as a fixed array-element member value (`[v: h'0102', x: uint]`) — the third literal LEXEME kind in this role, beside `contain.array-element.value.number` and `.text`; its map-representation twin is `contain.map-value.value.bytes`. RFC8610 §2.1 (bytes value), §3.4; ABNF grpent -> type -> type2 value -> bytes."
example = "a = [v: h'0102', x: uint]"

[[contain]]
id = "contain.array-element.type2.value.bare_exactly_once"
role = "role.array-element"
feature = "type2.value"
spec = "allowed"
note = "A BARE (unkeyed) literal as an array entry in exactly-once placement (`[5, x: uint]`) — no memberkey, so the grpent is a bare `type` that happens to be a value. The exactly-once side of the fixed-value cardinality boundary; its count-permitting siblings are `contain.occurrence-target.type2.value.zero_array` / `.optional_array` / `.plus_array` (`[* 5]`, `[? 5]`, `[+ 5]`). Distinct from `contain.array-element.type2.value`, which carries a memberkey (`[w: uint, v: 5]`) — keying is the varying axis between the two. RFC8610 §2.1, §3.4; ABNF grpent = type (no memberkey) -> type2 value."
example = "a = [5, x: uint]"
