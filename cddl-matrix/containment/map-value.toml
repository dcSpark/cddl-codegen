# Containment — role.map-value × feature. Nestings in a map member's VALUE position
# (`{ k: <here> }` / `{ * K => <here> }`). Schema = containment/type2.toml (id, role, feature, spec,
# note) PLUS an `example` parsed by the oracles to corroborate `spec` ("allowed"/"disallowed" per
# ABNF). The map-as-value cell (incl. table-as-value) is already in containment/type2.toml; only the
# further interesting value shapes are added here. Grammar anchor: grpent = [occur S] [memberkey S] type.

[[contain]]
id = "contain.map-value.type.choice"
role = "role.map-value"
feature = "type.choice"
spec = "allowed"
note = "A member's value is a `type`, which is a `/` type-choice, so the value may be a choice. RFC8610 §3.5.1, §2.2.2; ABNF grpent (memberkey type) -> type-choice. (2-field map: a single-field struct hits an orthogonal cddl-codegen panic.)"
example = "m = { k: int / tstr, j: uint }"

[[contain]]
id = "contain.map-value.type2.array"
role = "role.map-value"
feature = "type2.array"
spec = "allowed"
note = "An INLINE array as a member value. Unsupported: a heterogeneous inline array in a position requiring a TYPE becomes a struct, and a struct needs a name — where no `@name` comment can reach the site there is none to be had, so cddl-codegen rejects it gracefully and names both remedies (an explicit rule, or `; @name`). RFC8610 §3.5.1, §3.4."
example = "m = { k: [int], j: uint }"

[[contain]]
id = "contain.map-value.type2.tag"
role = "role.map-value"
feature = "type2.tag"
spec = "allowed"
note = "A tagged type (#6.n) as a member value. RFC8610 §3.5.1, §3.6; ABNF grpent value -> type2 tagged-data. (2-field map: a single-field struct hits an orthogonal cddl-codegen panic.)"
example = "m = { k: #6.10(int), j: uint }"

[[contain]]
id = "contain.map-value.prelude.false"
role = "role.map-value"
feature = "prelude.false"
spec = "allowed"
note = "The prelude constant `false` as a fixed map-member value (`{ k: false }`) — supported as a member; the top-level `foo = false` type is not. RFC8610 §2.1, §3.5.1. (2-field map: a single-field struct hits an orthogonal cddl-codegen panic.)"
example = "m = { k: false, j: uint }"

[[contain]]
id = "contain.map-value.type2.unwrap"
role = "role.map-value"
feature = "type2.unwrap"
spec = "allowed"
note = "`~name` (unwrap) as a member value. Unsupported because type2.unwrap is unsupported at all (not a context effect). RFC8610 §3.5.1, §3.7. (2-field map to avoid the orthogonal single-field-map panic.)"
example = "arr = [int]\nm = { k: ~arr, j: uint }"

# Fixed-value MEMBER enumeration in map-value position — the map-representation half of the sweep whose
# array-representation half lives in array-element.toml. Every example below is two-field, matching the
# shape convention of the rows above (the fixed member sits beside an ordinary typed member, so the cell
# isolates the VALUE position rather than the whole-map shape).

[[contain]]
id = "contain.map-value.prelude.true"
role = "role.map-value"
feature = "prelude.true"
spec = "allowed"
note = "The prelude constant `true` as a fixed map-member value (`{ k: true, j: uint }`) — beside the existing `contain.map-value.prelude.false`, and the map-representation twin of `contain.array-element.prelude.true`. RFC8610 §2.1, §3.5.1."
example = "m = { k: true, j: uint }"

[[contain]]
id = "contain.map-value.prelude.null"
role = "role.map-value"
feature = "prelude.null"
spec = "allowed"
note = "The prelude constant `null` as a fixed map-member value (`{ k: null, j: uint }`) — the map-representation twin of `contain.array-element.prelude.null`, and distinct from the choice-member nullable pattern (`contain.choice-member.prelude.null`), where `null` is an ARM rather than the whole value. RFC8610 §2.1, §3.5.1."
example = "m = { k: null, j: uint }"

[[contain]]
id = "contain.map-value.prelude.undefined"
role = "role.map-value"
feature = "prelude.undefined"
spec = "allowed"
note = "The prelude constant `undefined` as a fixed map-member value (`{ k: undefined, j: uint }`) — completes the four fixed prelude constants in this role beside `contain.map-value.prelude.true` / `.null` / `.false`; its array-representation twin is `contain.array-element.prelude.undefined`. RFC8610 §2.1, §3.5.1."
example = "m = { k: undefined, j: uint }"

[[contain]]
id = "contain.map-value.type2.tag.fixed_null"
role = "role.map-value"
feature = "type2.tag"
spec = "allowed"
note = "A tag WRAPPING a fixed null member value (`{ k: #6.1(null), j: uint }`) — the map-representation mirror of the array-element precedent `contain.array-element.type2.tag.fixed_null`, so the wrapped fixed-value arm is enumerated in both representations. Distinct from the plain `contain.map-value.type2.tag` (`#6.10(int)`), whose tag content is a TYPE rather than a literal. RFC8610 §3.5.1, §3.6, §2.1."
example = "m = { k: #6.1(null), j: uint }"

[[contain]]
id = "contain.map-value.type2.tag.fixed_bool"
role = "role.map-value"
feature = "type2.tag"
spec = "allowed"
note = "A tag WRAPPING a fixed bool member value (`{ k: #6.11(true), j: uint }`) — the map-representation mirror of the array-element precedent `contain.array-element.type2.tag.fixed_bool`, varying the wrapped constant away from `null` beside its `.fixed_null` sibling. RFC8610 §3.5.1, §3.6, §2.1."
example = "m = { k: #6.11(true), j: uint }"

[[contain]]
id = "contain.map-value.value.number"
role = "role.map-value"
feature = "value.number"
spec = "allowed"
note = "A numeric literal LEXEME as a fixed map-member value (`{ k: 5, j: uint }`) — the map-representation twin of `contain.array-element.value.number`. Paired with `contain.map-value.type2.value` exactly as the array file pairs `contain.array-element.value.number` with `contain.array-element.type2.value`: the two shapes key on the literal-lexeme feature and the literal-as-type2 feature respectively. RFC8610 §2.1, §3.5.1."
example = "m = { k: 5, j: uint }"

[[contain]]
id = "contain.map-value.value.text"
role = "role.map-value"
feature = "value.text"
spec = "allowed"
note = "A text literal as a fixed map-member value (`{ k: \"x\", j: uint }`) — the map-representation twin of `contain.array-element.value.text`, and the second literal lexeme kind in this role beside `contain.map-value.value.number`. RFC8610 §2.1, §3.5.1."
example = "m = { k: \"x\", j: uint }"

[[contain]]
id = "contain.map-value.value.bytes"
role = "role.map-value"
feature = "value.bytes"
spec = "allowed"
note = "A byte-string literal as a fixed map-member value (`{ k: h'0102', j: uint }`) — the third literal lexeme kind in this role beside `contain.map-value.value.number` / `.text`, and the map-representation twin of `contain.array-element.value.bytes`. RFC8610 §2.1 (bytes value), §3.5.1; ABNF grpent memberkey type -> type2 value -> bytes."
example = "m = { k: h'0102', j: uint }"

[[contain]]
id = "contain.map-value.type2.value"
role = "role.map-value"
feature = "type2.value"
spec = "allowed"
note = "A literal used as a member TYPE in map-value position (`{ j: uint, k: 5 }`) — the map-representation twin of `contain.array-element.type2.value` (`[w: uint, v: 5]`), and the type2-axis half of the pair whose lexeme-axis half is `contain.map-value.value.number`. The literal follows an ordinary typed member, matching the array precedent's ordering. RFC8610 §2.1, §3.5.1; ABNF grpent memberkey S type -> type2 value."
example = "m = { j: uint, k: 5 }"
