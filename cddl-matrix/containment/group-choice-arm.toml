# Containment — role.group-choice-arm × feature. The `//` arm itself is a container role.
# Cell ids use `contain.group-choice-arm.<feature>[.<variant>]`, where the variant records the
# representation (`map` / `array`) and any key-kind sub-axis because map-rep arms carry member keys
# and array-rep arms do not. Schema = containment/type2.toml plus an `example`.

[[contain]]
id = "contain.group-choice-arm.memberkey.bareword.map"
role = "role.group-choice-arm"
feature = "memberkey.bareword"
spec = "allowed"
note = "Baseline map-representation group-choice arm with a bareword text key. RFC8610 §2.2.2, §3.5.1."
example = "t = { a: uint // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.memberkey.bareword.record_map"
role = "role.group-choice-arm"
feature = "memberkey.bareword"
spec = "allowed"
note = "Map-representation group-choice arm whose bareword-keyed value is a named RECORD type (`a: st`, `st = [x: uint, y: tstr]`) rather than a scalar. The arm collapses to a variant that dispatches on the fixed key `a`, so the record's own array wire header sits one level in and never reaches the arm discriminant — green even when the sibling arm overlaps. RFC8610 §2.2.2, §3.5.1."
example = "t = { a: st // b: tstr }\nst = [x: uint, y: tstr]"

[[contain]]
id = "contain.group-choice-arm.memberkey.value.map"
role = "role.group-choice-arm"
feature = "memberkey.value"
spec = "allowed"
note = "Map-representation group-choice arm with a supported fixed uint key. RFC8610 §2.2.2, §3.5.1."
example = "t = { 1: uint // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.memberkey.value.text_map"
role = "role.group-choice-arm"
feature = "memberkey.value"
spec = "allowed"
note = "Map-representation group-choice arm with a supported fixed text key. RFC8610 §2.2.2, §3.5.1."
example = "t = { \"k\": uint // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.memberkey.value.nint_map"
role = "role.group-choice-arm"
feature = "memberkey.value"
spec = "allowed"
note = "Map-representation group-choice arm with a fixed negative integer key. Key writing/verification is only implemented for uint/text keys, matching the record map path; real nint support should land there before this flips to supported. RFC8610 §2.2.2, §3.5.1."
example = "neg = { -1: uint // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.memberkey.value.float_map"
role = "role.group-choice-arm"
feature = "memberkey.value"
spec = "allowed"
note = "Map-representation group-choice arm with a fixed float key. Key writing/verification is only implemented for uint/text keys, matching the record map path; real float-key support should land there before this flips to supported. RFC8610 §2.2.2, §3.5.1."
example = "flt = { 1.5: uint // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.memberkey.type1.map"
role = "role.group-choice-arm"
feature = "memberkey.type1"
spec = "allowed"
note = "Map-representation group-choice arm with a non-fixed key (`k => v`). Collapsing such an arm into an enum variant has nowhere to store the key and used to silently drop it; supporting this requires real table-arm dispatch. RFC8610 §2.2.2, §3.5.2."
example = "t = { uint => tstr // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.grpent.member.map"
role = "role.group-choice-arm"
feature = "grpent.member"
spec = "disallowed"
note = "Map-representation group-choice arm whose entry has no member key. A CBOR map arm must write key/value pairs, so a keyless arm has no well-formed wire shape; the Ruby reference rejects it as a map entry without member key while the Rust oracle accepts the grammar. A plain-group arm works because the referenced group owns its keys."
example = "g = { bytes // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.grpent.groupname.map"
role = "role.group-choice-arm"
feature = "grpent.groupname"
spec = "allowed"
note = "Map-representation group-choice arm that references a named group; the referenced group owns the map keys. RFC8610 §2.2.1, §2.2.2."
example = "g = { grp // b: tstr }\ngrp = (a: uint)"

[[contain]]
id = "contain.group-choice-arm.grpchoice.sequence.map"
role = "role.group-choice-arm"
feature = "grpchoice.sequence"
spec = "allowed"
note = "Map-representation group-choice arm with multiple fields, pinning arm dispatch for a whole grpchoice sequence rather than a single entry. RFC8610 §2.2.1, §2.2.2."
example = "t = { a: uint, b: tstr // c: bytes }"

[[contain]]
id = "contain.group-choice-arm.type2.value.map"
role = "role.group-choice-arm"
feature = "type2.value"
spec = "allowed"
note = "Map-representation group-choice arm with a fixed-value member type, a distinct dispatch/generation surface from fixed keys. RFC8610 §2.1, §2.2.2."
example = "t = { a: 0 // b: tstr }"

[[contain]]
id = "contain.group-choice-arm.grpent.member.array"
role = "role.group-choice-arm"
feature = "grpent.member"
spec = "allowed"
note = "Baseline array-representation group-choice arm: arms are positional entries and carry no map keys. RFC8610 §2.2.2, §3.4."
example = "t = [ uint // tstr ]"

[[contain]]
id = "contain.group-choice-arm.grpent.member.record_array"
role = "role.group-choice-arm"
feature = "grpent.member"
spec = "allowed"
note = "Array-representation group-choice arm whose member value is a named RECORD type (`a: st`, `st = [x: uint, y: tstr]` with a uint first field) rather than a scalar. A non-embedded record arm serializes NESTED — the outer array header then the record's OWN array header — so the arm's deserialize discriminant must peek the record's Array header, not its first field's uint type; otherwise spec-valid bytes fall through to NoVariantMatched against the overlapping `tstr` sibling. RFC8610 §2.2.2, §3.4."
example = "t = [ a: st // b: tstr ]\nst = [x: uint, y: tstr]"

[[contain]]
id = "contain.group-choice-arm.grpent.member.record_array_tagged"
role = "role.group-choice-arm"
feature = "grpent.member"
spec = "allowed"
note = "Array-representation group-choice arm whose member value is a named TAGGED record type (`a: tg`, `tg = #6.10([x: uint])`) — the tag-head variation of the record_array sibling. The arm's deserialize discriminant routes through `RustType::cbor_types`, whose struct-tag branch dispatches on the record's TAG head (CBOR major type 6), not its Array representation: an alternative discriminant that hand-mapped the record's rep (always Array/Map, never Tag) would dispatch tagged-record arms on the WRONG head type and fall through to NoVariantMatched on spec-valid bytes — while staying green through every untagged record-arm gate. This row is what makes that mis-mapping fail loudly. RFC8610 §2.2.2, §2.2.4, §3.4."
example = "t = [ a: tg // b: tstr ]\ntg = #6.10([x: uint])"

[[contain]]
id = "contain.group-choice-arm.grpchoice.sequence.array"
role = "role.group-choice-arm"
feature = "grpchoice.sequence"
spec = "allowed"
note = "Array-representation group-choice arm with multiple entries, pinning arm dispatch for a whole grpchoice sequence. RFC8610 §2.2.1, §2.2.2, §3.4."
example = "t = [ a: uint, b: tstr // c: bytes ]"

[[contain]]
id = "contain.group-choice-arm.grpent.groupname.array"
role = "role.group-choice-arm"
feature = "grpent.groupname"
spec = "allowed"
note = "Array-representation group-choice arm that references a named group. RFC8610 §2.2.1, §2.2.2, §3.4."
example = "t = [ grp // tstr ]\ngrp = (uint, uint)"

[[contain]]
id = "contain.group-choice-arm.grpent.inline_group.array"
role = "role.group-choice-arm"
feature = "grpent.inline_group"
spec = "allowed"
note = "Array-representation group-choice arm containing an inline parenthesized group. RFC8610 §2.2.1, §2.2.2, §3.4."
example = "t = [ (uint, tstr) // bytes ]"

# Fixed-value KINDS in the ARRAY-rep arm. The map-rep fixed-value arm is `type2.value.map` above
# (`{ a: 0 // b: tstr }`); bool and null are covered array-rep by `tests/corpus/group_choice_fixed_special.cddl`.
# These two enumerate the remaining kinds the array rep had never probed — a nint constant and a
# tag-wrapped fixed form — and each spells its DISPATCH PATH, because a kind proven on the type-match
# dispatch certifies nothing about the brute-force one (`contain.choice-member.prelude.true.same_major_brute`).

[[contain]]
id = "contain.group-choice-arm.type2.value.nint_array"
role = "role.group-choice-arm"
feature = "type2.value"
spec = "allowed"
note = "Array-representation group-choice arm carrying a fixed NEGATIVE integer member value (`[ v: -1 // label: tstr ]`) — the array-rep, nint-kind counterpart of `contain.group-choice-arm.type2.value.map` (`{ a: 0 // b: tstr }`, a fixed uint in the map rep). Dispatch path: TYPE-MATCH — the emitted deserialize reads the array header then matches `raw.cbor_type()`, routing CBOR major 1 (NegativeInteger) to this arm and major 3 (Text) to the sibling; the arm then verifies the constant and stores nothing, reporting a wrong constant as `FixedValueMismatch` with a `Key::Nint` naming the AUTHORED value (`-1`), not the `-1-N` wire form. No backtracking is emitted, so this row measures the type-match site only. RFC8610 §2.1, §2.2.2, §3.4."
example = "t = [ v: -1 // label: tstr ]"

[[contain]]
id = "contain.group-choice-arm.type2.tag.fixed_array"
role = "role.group-choice-arm"
feature = "type2.tag"
spec = "allowed"
note = "Array-representation group-choice arm whose member is a TAG-WRAPPED fixed value (`[ v: #6.11(true) // label: tstr ]`) — the arm-position counterpart of the member-position cells `contain.array-element.type2.tag.fixed_null` / `.fixed_bool`. Dispatch path: TYPE-MATCH, two-level — `raw.cbor_type()` routes CBOR major 6 (Tag) here and major 3 (Text) to the sibling, then a second match on `raw.tag()` admits 11 and rejects anything else as `TagMismatch`, after which the wrapped constant is verified as `FixedValueMismatch` and stored nowhere. The tag head is what makes the arm discriminable, so unlike the bare fixed specials this kind never needs the brute-force path. RFC8610 §2.1, §2.2.2, §2.2.4, §3.4, §3.6."
example = "t = [ v: #6.11(true) // label: tstr ]"

[[contain]]
id = "contain.group-choice-arm.type2.map.array"
role = "role.group-choice-arm"
feature = "type2.map"
spec = "allowed"
note = "Array-representation group-choice arm containing an anonymous map type; this isolates the anonymous-composite generation limit inside a `//` arm. RFC8610 §2.2.2, §3.4, §3.5."
example = "t = [ {a: int, b: uint} // tstr ]"

# Fixed-value FLOAT arms, one per DISPATCH PATH. A float is a CBOR major-7 special, so unlike the
# nint/tag rows above it can share its major with a sibling arm — which routes the emitted
# deserialize down a different site. Both are enumerated because a kind proven on one dispatch path
# certifies nothing about the other (`contain.choice-member.prelude.true.same_major_brute`).

[[contain]]
id = "contain.group-choice-arm.type2.value.float_array"
role = "role.group-choice-arm"
feature = "type2.value"
spec = "allowed"
note = "Array-representation group-choice arm carrying a fixed FLOAT member value beside a sibling arm of a DISJOINT CBOR major (`[ v: 1.5 // label: tstr ]`) — the float-kind counterpart of `contain.group-choice-arm.type2.value.nint_array` (a fixed nint) and `contain.group-choice-arm.type2.value.map` (a fixed uint, map rep). Dispatch path: TYPE-MATCH — the emitted deserialize reads the array header then matches `raw.cbor_type()`, routing CBOR major 7 (Special) to this arm and major 3 (Text) to the sibling; the arm then reads `raw.float()?`, verifies the constant with an exact `!=` compare and stores nothing, reporting a wrong constant as `FixedValueMismatch` with `Key::Float`, and falls through to `NoVariantMatched` on any other major. No backtracking is emitted, so this row measures the type-match site only — the same-major sibling arm is `contain.group-choice-arm.type2.value.float_same_major_array`. RFC8610 §2.1, §2.2.2, §3.4."
example = "t = [ v: 1.5 // label: tstr ]"

[[contain]]
id = "contain.group-choice-arm.type2.value.float_same_major_array"
role = "role.group-choice-arm"
feature = "type2.value"
spec = "allowed"
note = "Array-representation group-choice arm carrying a fixed FLOAT member value beside an arm that SHARES its CBOR major (`[ v: 1.5 // flag: true ]`) — `1.5` and `true` are both major 7, so the wire major cannot be the arm discriminant. Dispatch path: BRUTE-FORCE try-each-arm — the emitted deserialize reads the array header, anchors `raw.position()`, runs each arm's reader in source order (the float arm verifying its constant as `FixedValueMismatch` with `Key::Float`, the bool arm as `FixedValueMismatch` with `Key::Bool`) and rewinds to the anchor after each failure, ending in `NoVariantMatchedWithCauses`. That is a DISTINCT emission site from the type-match dispatch its disjoint-major sibling `contain.group-choice-arm.type2.value.float_array` takes, which is why the float kind is enumerated on both. The group-choice spelling is deliberate: the same pairing as a bare TYPE choice is a different (and currently defective) path — see `cddl-matrix/ROADMAP.md` § findings. RFC8610 §2.1, §2.2.2, §3.4, App. D."
example = "t = [ v: 1.5 // flag: true ]"
