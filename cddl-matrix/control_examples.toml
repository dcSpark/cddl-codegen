# Minimal CDDL examples for per-control-op SUPPORT probing, keyed by control-op id.
#
# The IANA registry (sources/cddl-control-operators.csv) is byte-pinned and carries no examples, so they
# live here. verify.ts probes each through cddl-codegen (compile-gated) -> a [[support]] row keyed by
# `ctl.<name>`, exactly like features. Control ops are IANA-registry-authoritative, so ruby/rust are
# CORROBORATION ONLY here (an op a given ruby/rust version doesn't implement is not "invalid CDDL").
#
# Each example ISOLATES the operator in `target .op controller` form. The 9 cddl-codegen implements
# (.size .cbor .default .eq .ne .le .lt .ge .gt) must COMPILE; the rest reach the op dispatch and
# panic/parse-reject (-> unsupported), which is the correct verdict. Forms follow each op's DEFINING
# RFC; the oracles can only corroborate ops they implement (ruby's generate mode exits 65 for any op
# it postdates, valid or not — verify.ts surfaces those ids as an uncorroborated-REVIEW list).
# The ruby `generate` exit is a Bernoulli trial for a value-space-NARROWING op (ruby draws a RANDOM
# instance and self-validates it, so it flips ruby=ok/fail across runs on identical input — observed:
# ctl.and, `uint .and (0..9)`; root cause in cddl-matrix/upstream-reports/ruby-cddl-bernoulli-constraint-controllers.md).
# verify.ts NEVER derives a verdict from `generate` for those ops (classified statically by controller
# op-name, lib.ts `rubyGenerateIsBernoulli`): the `ruby=` clause becomes `ruby=ok(validate)`/
# `fail(validate)` — ruby `validate` over the row's committed spec-valid decode vectors — where the
# decode catalog has them, else the STABLE `ruby=nondet(generate)` token. So the annotations diff is
# deterministic; a value-narrowing row's `ruby=` clause no longer flips as noise.

# --- RFC 8610 (the 9 supported + the 5 it parses-but-rejects) ---
[[example]]
id = "ctl.size"
example = "x = bytes .size 4"

[[example]]
id = "ctl.cbor"
example = "x = bytes .cbor uint"   # uint payload keeps this row on the `.cbor` control-op axis; the int-emission axis (a bare `int` alias / `.cbor int` payload) is covered by prelude.int + tests/corpus/int_alias.cddl

[[example]]
id = "ctl.default"
example = "m = { a: uint, ? b: uint .default 0 }"   # .default is a map-member default; 2 fields dodge the single-field-map bug

# The six numeric range/eq ops target `int` (not `uint`): the rust cddl CLI (0.10.5) does not
# enforce these ops over a `uint` target during validate (a target-type-specific gap), which blocked
# class="constraint"
# reject vectors — the decode-conformance catalog certifies spec-INVALID only when BOTH oracles
# reject. Over `int` both oracles enforce (verified: each boundary violation below exits 1 in
# both). Bounds are literal and non-vacuous over the base type (.ge 5, not .ge 0) so an in-type
# violating vector exists for every op.
[[example]]
id = "ctl.le"
example = "x = int .le 10"

[[example]]
id = "ctl.lt"
example = "x = int .lt 10"

[[example]]
id = "ctl.ge"
example = "x = int .ge 5"

[[example]]
id = "ctl.gt"
example = "x = int .gt 5"

[[example]]
id = "ctl.eq"
example = "x = int .eq 5"

[[example]]
id = "ctl.ne"
example = "x = int .ne 5"

[[example]]
id = "ctl.bits"
example = "x = uint .bits b\nb = &(a: 0, c: 1)"

[[example]]
id = "ctl.regexp"
example = 'x = tstr .regexp "[0-9]+"'

[[example]]
id = "ctl.cborseq"
# RFC 8610 §3.8.4: the decoded data items are taken as an ARRAY, so the controller must be an
# array type (a scalar like `uint` is unsatisfiable and made the probe verdict vacuous)
example = "x = bytes .cborseq [+ uint]"

[[example]]
id = "ctl.within"
example = "x = uint .within int"

[[example]]
id = "ctl.and"
example = "x = uint .and (0..9)"

# --- RFC 9090 ---
# `.oid` takes an array-of-arcs controller (bare `bytes .oid` is GRAMMAR-invalid: `type1` requires
# a controller after a ctlop); `.sdnv`/`.sdnvseq` apply to byte strings, with a uint /
# array-of-uints controller respectively. The previous forms were rejected by the reference oracle
# at parse (ruby exit 65), so their "unsupported" verdicts only proved rejection of malformed input.
[[example]]
id = "ctl.oid"
example = "x = bytes .oid [2, 5, 4, 6]"

[[example]]
id = "ctl.sdnv"
example = "x = bytes .sdnv 6"

[[example]]
id = "ctl.sdnvseq"
example = "x = bytes .sdnvseq [85, 4, 6]"

# --- RFC 9165 ---
[[example]]
id = "ctl.plus"
example = "x = uint .plus 1"

[[example]]
id = "ctl.cat"
example = 'x = tstr .cat "y"'

[[example]]
id = "ctl.det"
example = 'x = tstr .det "y"'

[[example]]
id = "ctl.abnf"
example = 'x = tstr .abnf "1*DIGIT"'

[[example]]
id = "ctl.abnfb"
example = 'x = bytes .abnfb "1*DIGIT"'

[[example]]
id = "ctl.feature"
example = 'x = tstr .feature "f"'

# --- RFC 9741 (text/binary conversions) ---
[[example]]
id = "ctl.b32"
example = "x = tstr .b32 bytes"

[[example]]
id = "ctl.h32"
example = "x = tstr .h32 bytes"

[[example]]
id = "ctl.b45"
example = "x = tstr .b45 bytes"

[[example]]
id = "ctl.b64u"
example = "x = tstr .b64u bytes"

[[example]]
id = "ctl.b64u-sloppy"
example = "x = tstr .b64u-sloppy bytes"

[[example]]
id = "ctl.b64c"
example = "x = tstr .b64c bytes"

[[example]]
id = "ctl.b64c-sloppy"
example = "x = tstr .b64c-sloppy bytes"

[[example]]
id = "ctl.hex"
example = "x = tstr .hex bytes"

[[example]]
id = "ctl.hexlc"
example = "x = tstr .hexlc bytes"

[[example]]
id = "ctl.hexuc"
example = "x = tstr .hexuc bytes"

[[example]]
id = "ctl.base10"
example = "x = tstr .base10 int"

[[example]]
id = "ctl.json"
example = "x = tstr .json int"

[[example]]
id = "ctl.printf"
# RFC 9741: the .printf controller is an ARRAY of one format string plus data items (a bare string
# controller is not a valid form)
example = 'x = tstr .printf ["%04x", 20]'

[[example]]
id = "ctl.join"
example = "x = tstr .join [tstr, tstr]"
