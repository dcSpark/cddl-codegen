# CBOR encoding axis (RFC 8949 §3). The "representation" dimension: a single CDDL feature can be
# serialized multiple ways (argument width, definite vs indefinite length). golden_hex/COVERAGE.md is
# the projection onto this axis; features.toml links to these ids via `encodings = [...]`.
#
# This file is the FULL major-type (0..7) x length/ai-form grid. Two layers of rows:
#   1. PARENT rows  `enc.major<N>` (+ `enc.major7.float`) — one per CBOR major type. These are the ids
#      features.toml references; kept stable. `forms` summarizes the cells beneath them.
#   2. CELL rows    `enc.major<N>.<form>` — one per distinct additional-information (ai) form, i.e. one
#      grid cell. A cell is a *distinct encoding alternative*, so it gets its own row (same rule the
#      feature axis uses). Concrete vectors are cited from sources/appendix_a.json where available.
#
# CBOR head byte = (major_type << 5) | additional_info (RFC8949 §3.1, Table 1). The ai field (0..31):
#   0..23  argument is the ai itself        (immediate / no following bytes)
#   24     1 following byte   (uint8 arg)
#   25     2 following bytes  (uint16 arg)
#   26     4 following bytes  (uint32 arg)
#   27     8 following bytes  (uint64 arg)
#   28..30 reserved — NOT well-formed (RFC8949 §3.3)
#   31     indefinite length (major 2..5) / "break" stop code (major 7) / reserved (major 0,1,6)
#
# Schema per [[encoding]] (unchanged):
#   id           "enc.major<N>[.sub]"
#   major_type   CBOR major type 0..7
#   rfc          RFC8949 section
#   forms        the length / additional-info variant(s) this row covers
#   note         prose + concrete appendix_a.json vectors where available

# =====================================================================================
# PARENT rows — one per major type (the ids features.toml links to). Kept stable.
# =====================================================================================

[[encoding]]
id = "enc.major0"
major_type = 0
rfc = "RFC8949 §3.1"
forms = ["ai 0-23 immediate", "ai 24 (1B)", "ai 25 (2B)", "ai 26 (4B)", "ai 27 (8B)"]
note = "Unsigned integer; argument = the value. The additional-info width is the encoding variation. ai 28-31 reserved (ill-formed). Cells: enc.major0.imm/.ai24/.ai25/.ai26/.ai27."

[[encoding]]
id = "enc.major1"
major_type = 1
rfc = "RFC8949 §3.1"
forms = ["ai 0-23 immediate", "ai 24 (1B)", "ai 25 (2B)", "ai 26 (4B)", "ai 27 (8B)"]
note = "Negative integer, value = -1 - argument. ai 28-31 reserved (ill-formed). Cells: enc.major1.imm/.ai24/.ai25/.ai26/.ai27."

[[encoding]]
id = "enc.major2"
major_type = 2
rfc = "RFC8949 §3.1, §3.2"
forms = ["ai 0-23 immediate length", "ai 24/25/26/27 length", "ai 31 indefinite (0x5f..0xff)"]
note = "Byte string; argument = byte length (definite) or indefinite chunks. ai 28-30 reserved. Cells: enc.major2.imm/.ai24/.ai25/.ai26/.ai27/.indef."

[[encoding]]
id = "enc.major3"
major_type = 3
rfc = "RFC8949 §3.1, §3.2"
forms = ["ai 0-23 immediate length", "ai 24/25/26/27 length", "ai 31 indefinite (0x7f..0xff)"]
note = "Text string (UTF-8); argument = byte length. ai 28-30 reserved. Cells: enc.major3.imm/.ai24/.ai25/.ai26/.ai27/.indef."

[[encoding]]
id = "enc.major4"
major_type = 4
rfc = "RFC8949 §3.1, §3.2"
forms = ["ai 0-23 immediate count", "ai 24/25/26/27 count", "ai 31 indefinite (0x9f..0xff)"]
note = "Array; argument = element count. ai 28-30 reserved. Cells: enc.major4.imm/.ai24/.ai25/.ai26/.ai27/.indef."

[[encoding]]
id = "enc.major5"
major_type = 5
rfc = "RFC8949 §3.1, §3.2"
forms = ["ai 0-23 immediate count", "ai 24/25/26/27 count", "ai 31 indefinite (0xbf..0xff)"]
note = "Map; argument = number of key/value pairs. ai 28-30 reserved. Cells: enc.major5.imm/.ai24/.ai25/.ai26/.ai27/.indef."

[[encoding]]
id = "enc.major6"
major_type = 6
rfc = "RFC8949 §3.1, §3.4"
forms = ["ai 0-23 immediate tag#", "ai 24 (1B)", "ai 25 (2B)", "ai 26 (4B)", "ai 27 (8B)"]
note = "Tagged data item; argument = tag number, followed by one enclosed data item. ai 28-31 reserved. Cells: enc.major6.imm/.ai24/.ai25/.ai26/.ai27."

[[encoding]]
id = "enc.major7"
major_type = 7
rfc = "RFC8949 §3.1, §3.3"
forms = ["simple 0-23 immediate", "simple 24 (1B)", "float16 (ai25)", "float32 (ai26)", "float64 (ai27)", "break (ai31, 0xff)"]
note = "Simple values, floats, and the break stop code; ai selects the meaning (not a length). ai 28-30 reserved. Cells: enc.major7.simple_imm/.ai24/.float16/.float32/.float64/.break."

[[encoding]]
id = "enc.major7.float"
major_type = 7
rfc = "RFC8949 §3.3"
forms = ["float16 (0xf9)", "float32 (0xfa)", "float64 (0xfb)"]
note = "Float subset of major 7 (the half/single/double IEEE 754 widths). Cells: enc.major7.float16/.float32/.float64."

# =====================================================================================
# GRID CELLS — major type 0 : unsigned integer (RFC8949 §3.1)
# =====================================================================================

[[encoding]]
id = "enc.major0.imm"
major_type = 0
rfc = "RFC8949 §3.1"
forms = ["ai 0-23 immediate (head 0x00..0x17)"]
note = "Value carried in the ai, no following bytes. appendix_a: 00=0, 01=1, 0a=10, 17=23."

[[encoding]]
id = "enc.major0.ai24"
major_type = 0
rfc = "RFC8949 §3.1"
forms = ["ai 24, 1-byte uint8 argument (head 0x18)"]
note = "appendix_a: 1818=24, 1819=25, 1864=100."

[[encoding]]
id = "enc.major0.ai25"
major_type = 0
rfc = "RFC8949 §3.1"
forms = ["ai 25, 2-byte uint16 argument (head 0x19)"]
note = "appendix_a: 1903e8=1000."

[[encoding]]
id = "enc.major0.ai26"
major_type = 0
rfc = "RFC8949 §3.1"
forms = ["ai 26, 4-byte uint32 argument (head 0x1a)"]
note = "appendix_a: 1a000f4240=1000000."

[[encoding]]
id = "enc.major0.ai27"
major_type = 0
rfc = "RFC8949 §3.1"
forms = ["ai 27, 8-byte uint64 argument (head 0x1b)"]
note = "appendix_a: 1b000000e8d4a51000=1000000000000, 1bffffffffffffffff=18446744073709551615 (2^64-1, max uint)."

