# =====================================================================================

[[encoding]]
id = "enc.major7.simple_imm"
major_type = 7
rfc = "RFC8949 §3.3"
forms = ["ai 0-23 immediate simple value (head 0xe0..0xf7)"]
note = "Simple value in ai (incl. 20=false, 21=true, 22=null, 23=undefined). appendix_a: f4=false, f5=true, f6=null, f7=undefined, f0=simple(16)."

[[encoding]]
id = "enc.major7.ai24"
major_type = 7
rfc = "RFC8949 §3.3"
forms = ["ai 24, 1-byte simple value 32-255 (head 0xf8)"]
note = "Simple values 32..255. appendix_a: f818=simple(24), f8ff=simple(255). (0..31 in this form are not well-formed.)"

[[encoding]]
id = "enc.major7.float16"
major_type = 7
rfc = "RFC8949 §3.3"
forms = ["ai 25, IEEE 754 half-precision (head 0xf9)"]
note = "appendix_a: f90000=0.0, f98000=-0.0, f93c00=1.0, f93e00=1.5, f97bff=65504.0, f97c00=Infinity, f97e00=NaN, f9fc00=-Infinity."

[[encoding]]
id = "enc.major7.float32"
major_type = 7
rfc = "RFC8949 §3.3"
forms = ["ai 26, IEEE 754 single-precision (head 0xfa)"]
note = "appendix_a: fa47c35000=100000.0, fa7f7fffff=3.4028234663852886e+38, fa7f800000=Infinity, faff800000=-Infinity, fa7fc00000=NaN."

[[encoding]]
id = "enc.major7.float64"
major_type = 7
rfc = "RFC8949 §3.3"
forms = ["ai 27, IEEE 754 double-precision (head 0xfb)"]
note = "appendix_a: fb3ff199999999999a=1.1, fbc010666666666666=-4.1, fb7e37e43c8800759c=1.0e+300, fb7ff0000000000000=Infinity, fb7ff8000000000000=NaN."

[[encoding]]
id = "enc.major7.break"
major_type = 7
rfc = "RFC8949 §3.2, §3.3"
forms = ["ai 31 break stop code (single byte 0xff)"]
note = "Terminates an indefinite-length bstr/tstr/array/map. appendix_a: trailing ff in 5f...ff, 7f...ff, 9f...ff, bf...ff."
