# CDDL standard prelude — one row per prelude typename (RFC 8610 App. D / sources/cddl.prelude).
# These are not ABNF grammar alternatives; they are the 40 named types CDDL implicitly prepends to
# every spec. Each is a fixed definition built out of the grammar (data-major-type sigils, tagged
# data, and type choices). `production = "prelude"`; `alt` is the verbatim right-hand side from
# sources/cddl.prelude. ids are `prelude.<name>` (referenced by containment.toml + annotations/*).
#
# Schema per [[feature]] (matches features/type2.toml exactly):
#   id          stable slug (prelude.<name>)
#   production  "prelude"
#   alt         the verbatim RHS of the prelude definition
#   rfc         spec anchor: RFC 8610 App. D + the prelude rule (NO line numbers)
#   profile     CDDL language profile (RFC) that introduces the type; "RFC8610" for the whole prelude
#   title       short human label
#   desc        one-line description
#   example     minimal CDDL snippet that references the typename (parsed & probed)
#   encodings   (optional) CBOR encodings the type can take (links into encodings.toml)
#
# Support status is NOT here — see annotations/cddl_codegen.toml (master stays pure spec).

# --- root types (data-major-type sigils) ---
[[feature]]
id = "prelude.any"
production = "prelude"
alt = "#"
rfc = "RFC8610 App. D; prelude / any"
profile = "RFC8610"
title = "any"
desc = "Matches any single CBOR data item (no constraint)."
example = "x = any"

[[feature]]
id = "prelude.uint"
production = "prelude"
alt = "#0"
rfc = "RFC8610 App. D; prelude / uint"
profile = "RFC8610"
title = "uint"
desc = "Unsigned integer (CBOR major type 0)."
example = "x = uint"
encodings = ["enc.major0"]

[[feature]]
id = "prelude.nint"
production = "prelude"
alt = "#1"
rfc = "RFC8610 App. D; prelude / nint"
profile = "RFC8610"
title = "nint"
desc = "Negative integer (CBOR major type 1)."
example = "x = nint"
encodings = ["enc.major1"]

[[feature]]
id = "prelude.int"
production = "prelude"
alt = "uint / nint"
rfc = "RFC8610 App. D; prelude / int"
profile = "RFC8610"
title = "int"
desc = "Signed integer: a uint or an nint."
# Record form, not a bare `x = int`: a top-level alias to `int` emits `pub type X = Int;` (the generator's
# Int wrapper isn't emitted for a bare alias) which fails the compile-gate. `int` works in any real context.
example = "holder = [x: int]"
encodings = ["enc.major0", "enc.major1"]

[[feature]]
id = "prelude.bstr"
production = "prelude"
alt = "#2"
rfc = "RFC8610 App. D; prelude / bstr"
profile = "RFC8610"
title = "bstr"
desc = "Byte string (CBOR major type 2)."
example = "x = bstr"
encodings = ["enc.major2"]

[[feature]]
id = "prelude.bytes"
production = "prelude"
alt = "bstr"
rfc = "RFC8610 App. D; prelude / bytes"
profile = "RFC8610"
title = "bytes"
desc = "Alias of bstr (byte string)."
example = "x = bytes"
encodings = ["enc.major2"]

[[feature]]
id = "prelude.tstr"
production = "prelude"
alt = "#3"
rfc = "RFC8610 App. D; prelude / tstr"
profile = "RFC8610"
title = "tstr"
desc = "Text string, UTF-8 (CBOR major type 3)."
example = "x = tstr"
encodings = ["enc.major3"]

[[feature]]
id = "prelude.text"
production = "prelude"
alt = "tstr"
rfc = "RFC8610 App. D; prelude / text"
profile = "RFC8610"
title = "text"
desc = "Alias of tstr (text string)."
example = "x = text"
encodings = ["enc.major3"]

# --- tag-based date/time types ---
[[feature]]
id = "prelude.tdate"
production = "prelude"
alt = "#6.0(tstr)"
rfc = "RFC8610 App. D; prelude / tdate"
profile = "RFC8610"
title = "tdate"
desc = "Standard date/time string: CBOR tag 0 wrapping a tstr."
example = "x = tdate"
encodings = ["enc.major6"]

[[feature]]
id = "prelude.time"
production = "prelude"
alt = "#6.1(number)"
rfc = "RFC8610 App. D; prelude / time"
profile = "RFC8610"
title = "time"
desc = "Epoch-based date/time: CBOR tag 1 wrapping a number."
example = "x = time"
encodings = ["enc.major6"]

[[feature]]
id = "prelude.number"
production = "prelude"
alt = "int / float"
rfc = "RFC8610 App. D; prelude / number"
profile = "RFC8610"
title = "number"
desc = "Any number: an int or a float."
example = "x = number"
encodings = ["enc.major0", "enc.major1", "enc.major7.float"]

# --- bignum / arbitrary-precision integer types ---
[[feature]]
id = "prelude.biguint"
production = "prelude"
alt = "#6.2(bstr)"
rfc = "RFC8610 App. D; prelude / biguint"
profile = "RFC8610"
title = "biguint"
desc = "Unsigned bignum: CBOR tag 2 wrapping a bstr."
example = "x = biguint"
encodings = ["enc.major6"]

[[feature]]
id = "prelude.bignint"
production = "prelude"
alt = "#6.3(bstr)"
rfc = "RFC8610 App. D; prelude / bignint"
profile = "RFC8610"
title = "bignint"
desc = "Negative bignum: CBOR tag 3 wrapping a bstr."
example = "x = bignint"
encodings = ["enc.major6"]

[[feature]]
id = "prelude.bigint"
production = "prelude"
alt = "biguint / bignint"
rfc = "RFC8610 App. D; prelude / bigint"
profile = "RFC8610"
title = "bigint"
desc = "Arbitrary-precision integer: a biguint or a bignint."
example = "x = bigint"
encodings = ["enc.major6"]

[[feature]]
id = "prelude.integer"
production = "prelude"
alt = "int / bigint"
rfc = "RFC8610 App. D; prelude / integer"
profile = "RFC8610"
title = "integer"
desc = "Any integer: an int or a bigint."
example = "x = integer"
encodings = ["enc.major0", "enc.major1", "enc.major6"]

[[feature]]
id = "prelude.unsigned"
production = "prelude"
alt = "uint / biguint"
rfc = "RFC8610 App. D; prelude / unsigned"
profile = "RFC8610"
title = "unsigned"
desc = "Any unsigned integer: a uint or a biguint."
example = "x = unsigned"
encodings = ["enc.major0", "enc.major6"]

[[feature]]
id = "prelude.decfrac"
production = "prelude"
alt = "#6.4([e10: int, m: integer])"
rfc = "RFC8610 App. D; prelude / decfrac"
profile = "RFC8610"
title = "decfrac"
desc = "Decimal fraction: CBOR tag 4, an array [exponent (base 10), mantissa]."
example = "x = decfrac"
encodings = ["enc.major6"]

[[feature]]
id = "prelude.bigfloat"
production = "prelude"
alt = "#6.5([e2: int, m: integer])"
rfc = "RFC8610 App. D; prelude / bigfloat"
profile = "RFC8610"
title = "bigfloat"
desc = "Bigfloat: CBOR tag 5, an array [exponent (base 2), mantissa]."
example = "x = bigfloat"
encodings = ["enc.major6"]

