# CDDL features — composition productions: group / grpchoice / grpent / memberkey / occur.
# One row per distinct ABNF production alternative (RFC 9682 grammar, RFC 8610 semantics).
# These are the structural productions that build a *group* — the body shared by maps `{}`,
# arrays `[]`, and named groups `()` — out of entries, member keys, and occurrence indicators.
#
# Schema per [[feature]] — identical to features/type2.toml:
#   id, production, alt, rfc, profile, title, desc, example, [roles], [encodings]
# (`profile` = the RFC that introduces the construct; default "RFC8610" — see type2.toml.)
#
# Support status is NOT here — see annotations/ (master stays pure spec).

# --- group = grpchoice *(S "//" S grpchoice) ---
[[feature]]
id = "group.choice"
production = "group"
alt = 'grpchoice *(S "//" S grpchoice)'
rfc = "RFC8610 §2.2.2; ABNF group / group-choice (//)"
profile = "RFC8610"
title = "Group choice (//)"
desc = "Alternation between whole groups: the group matches one of several grpchoice branches."
example = "g = { a: uint // b: tstr }"
roles = ["role.choice-member"]

# --- grpchoice = *(grpent optcom) ---
[[feature]]
id = "grpchoice.sequence"
production = "grpchoice"
alt = "*(grpent optcom)"
rfc = "RFC8610 §2.2.1; ABNF grpchoice / grpent optcom"
profile = "RFC8610"
title = "Group-entry sequence"
desc = "A grpchoice is a sequence of group entries separated by optional commas (optcom = S [\",\" S])."
example = "point = { x: int, y: int }"

# --- grpent = [occur S] [memberkey S] type ---
[[feature]]
id = "grpent.member"
production = "grpent"
alt = "[occur S] [memberkey S] type"
rfc = "RFC8610 §2.2.1, §3.5.1; ABNF grpent / member"
profile = "RFC8610"
title = "Member entry (optional occur + optional memberkey + type)"
desc = "A group entry that is a type, optionally preceded by a memberkey (named member) and/or an occurrence indicator; with the memberkey ABSENT it is a positional, type-only element. This example isolates the absent-memberkey path (the memberkey-present path is covered by memberkey.*)."
example = "g = [int]"
roles = ["role.occurrence-target", "role.map-value", "role.array-element"]

# --- grpent = [occur S] groupname [genericarg] ---
[[feature]]
id = "grpent.groupname"
production = "grpent"
alt = "[occur S] groupname [genericarg]"
rfc = "RFC8610 §2.2.1; ABNF grpent / groupname"
profile = "RFC8610"
title = "Group-name reference entry"
desc = "A group entry that references a named group by name, inlining that group's entries; may carry generic args and an occurrence."
example = "g = [coords]\ncoords = (uint, uint)"
roles = ["role.generic-arg", "role.occurrence-target"]

# --- grpent = [occur S] "(" S group S ")" ---
[[feature]]
id = "grpent.inline_group"
production = "grpent"
alt = '[occur S] "(" S group S ")"'
rfc = "RFC8610 §2.2.1; ABNF grpent / inline-group"
profile = "RFC8610"
title = "Inline (parenthesized) group entry"
desc = "A group entry that is itself a parenthesized group; the isolated form is just `(...)` as one entry (an occurrence can then apply to the whole sub-group — see occurrence-target containment)."
example = "g = [(uint, tstr)]"
roles = ["role.occurrence-target"]

# --- memberkey = type1 S ["^" S] "=>" ---
[[feature]]
id = "memberkey.type1"
production = "memberkey"
alt = 'type1 S ["^" S] "=>"'
rfc = "RFC8610 §3.5.2; ABNF memberkey / type1 \"=>\""
profile = "RFC8610"
title = "Type memberkey (t =>)"
desc = "A memberkey given as a full type expression followed by =>; the key matches any data item of that type (table / general form)."
example = "m = { tstr => int }"
roles = ["role.map-key"]

# --- memberkey = bareword S ":" ---
[[feature]]
id = "memberkey.bareword"
production = "memberkey"
alt = 'bareword S ":"'
rfc = "RFC8610 §3.5.1; ABNF memberkey / bareword \":\""
profile = "RFC8610"
title = "Bareword memberkey (k:)"
desc = "A memberkey given as a bareword (id) followed by ':'; shorthand for the text-string key \"k\" => and carries an implicit cut."
example = "m = [name: tstr]"
roles = ["role.map-key"]

# --- memberkey = value S ":" ---
[[feature]]
id = "memberkey.value"
production = "memberkey"
alt = 'value S ":"'
rfc = "RFC8610 §3.5.1; ABNF memberkey / value \":\""
profile = "RFC8610"
title = "Value memberkey (1:)"
desc = "A memberkey given as a literal value (number/text/bytes) followed by ':'; equivalent to value => and carries an implicit cut."
example = "m = { 1: tstr }"
roles = ["role.map-key"]

# --- memberkey cut: the "^" in `type1 S ["^" S] "=>"` (explicit cut) ---
[[feature]]
id = "memberkey.cut"
production = "memberkey"
alt = 'type1 S "^" S "=>"'
rfc = "RFC8610 §3.5.4; ABNF memberkey / cut (^)"
profile = "RFC8610"
title = "Cut in a => memberkey (^)"
desc = "The optional '^' marks a => memberkey as a cut, so a matched key is not also offered to later (e.g. wildcard) entries; the ':' shortcut forms (bareword/value) carry this cut implicitly."
example = "m = { \"a\" ^ => int }"
roles = ["role.map-key"]

# --- occur = "?" ---
[[feature]]
id = "occur.optional"
production = "occur"
alt = '"?"'
rfc = "RFC8610 §3.2; ABNF occur / optional"
profile = "RFC8610"
title = "Optional occurrence (?)"
desc = "The entry occurs zero or one time."
example = "g = [? name: tstr]"
roles = ["role.occurrence-target"]

# --- occur = [uint] "*" [uint]  (bare *) ---
[[feature]]
id = "occur.zero_or_more"
production = "occur"
alt = '[uint] "*" [uint]'
rfc = "RFC8610 §3.2; ABNF occur / [uint] \"*\" [uint]"
profile = "RFC8610"
title = "Zero-or-more occurrence (*)"
desc = "Bare '*' with both bounds omitted: the entry occurs any number of times, including zero."
example = "g = [* uint]"
roles = ["role.occurrence-target"]

# --- occur = "+" ---
[[feature]]
id = "occur.one_or_more"
production = "occur"
alt = '"+"'
rfc = "RFC8610 §3.2; ABNF occur / one-or-more"
profile = "RFC8610"
title = "One-or-more occurrence (+)"
desc = "The entry occurs one or more times (equivalent to 1*)."
example = "g = [+ uint]"
roles = ["role.occurrence-target"]

# --- occur = [uint] "*" [uint]  (bounded n*m) ---
[[feature]]
id = "occur.bounded"
production = "occur"
alt = '[uint] "*" [uint]'
rfc = "RFC8610 §3.2; ABNF occur / [uint] \"*\" [uint]"
profile = "RFC8610"
title = "Bounded occurrence (n*m)"
desc = "Same '*' production as zero-or-more but with explicit lower and/or upper bound (n*, *m, or n*m): the entry occurs between n and m times."
example = "g = [2*5 uint]"
roles = ["role.occurrence-target"]

# --- occur one-sided-bound variation rows (n* / *m) ---
# The occur.bounded base row above is probed only from the two-sided form `2*5`. These enumerate the
# one-sided arms of the SAME `[uint] "*" [uint]` alternative — the variation the base desc mentions only
# in prose. Enumerated for the "Intra-alternative variation rows" reason (ROADMAP.md): the
# enforcement axis reaches only as far as row enumeration,
# so a one-sided bound with no row is an enforcement blind spot, not just missing coverage accounting.
[[feature]]
id = "occur.bounded.lower"
production = "occur"
alt = '[uint] "*" [uint]'
rfc = "RFC8610 §3.2; ABNF occur / [uint] \"*\" [uint]"
profile = "RFC8610"
title = "Lower-bound-only occurrence (n*)"
desc = "One-sided variation of occur.bounded: a lower-bound-only occurrence (`2*`) whose count check has NO upper arm — the entry occurs at least n times, unbounded above. A distinct enforcement surface from the two-sided `2*5` base row, per the \"Intra-alternative variation rows\" lesson that the enforcement axis reaches only as far as row enumeration."
example = "g = [2* uint]"
roles = ["role.occurrence-target"]

[[feature]]
id = "occur.bounded.upper"
production = "occur"
alt = '[uint] "*" [uint]'
rfc = "RFC8610 §3.2; ABNF occur / [uint] \"*\" [uint]"
profile = "RFC8610"
title = "Upper-bound-only occurrence (*m)"
desc = "One-sided variation of occur.bounded: an upper-bound-only, zero-permitting occurrence (`*5`) — the entry occurs at most m times, zero allowed. On the ARRAY side this is a `Vec` length check (distinct from the map-side zero-permitting form's graceful rejection recorded in § findings, where a zero-permitting keyed struct-map field is rejected rather than narrowed). A distinct enforcement surface the two-sided base row cannot reach, per the \"Intra-alternative variation rows\" lesson that enforcement reaches only as far as row enumeration."
example = "g = [*5 uint]"
roles = ["role.occurrence-target"]
