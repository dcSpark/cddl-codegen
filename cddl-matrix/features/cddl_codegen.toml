# CDDL_CODEGEN profile — cddl-codegen's OWN extension surface (the comment DSL + sentinel typenames).
# These are NOT RFC 8610; they are a VENDOR profile, modelled "as if its own RFC" so they ride the same
# pipeline (feature ids -> bidirectional lint -> support annotations -> the D3 corpus coverage join) with
# zero special-casing. `profile = "CDDL_CODEGEN"` is the tag a non-cddl-codegen consumer filters out as
# out-of-profile (exactly as it filters RFC 9682).
#
# PINNED SOURCE (the backward-lint condition — every feature must resolve to a real source, like prelude
# features resolve to cddl.prelude): the `alt` token is the literal directive/marker, and verify.ts
# asserts it appears in the in-repo source — `src/comment_ast.rs` (the `tag("@…")` handlers) for the
# `comment_dsl` directives, `src/parsing.rs` (the *_MARKER consts) for the `sentinel` typenames. Same-repo
# means the source is "pinned" for free and structurally can't drift from the implementation. verify.ts
# also runs the FORWARD lint: every directive/marker in those files must have a feature here.
#
# SPEC-VALIDITY AUTHORITY: for this profile, cddl-codegen IS the spec author, so the ruby/rust reference
# oracles do NOT gate validity (they don't know these constructs — ruby rejects the sentinel typenames,
# which is expected, not a failure). verify.ts treats CDDL_CODEGEN features as spec-valid by definition
# (they resolve to the vendor source) and reports support from the cddl-codegen probe alone.
#
# Schema matches features/type2.toml; examples mirror the tests/corpus/dsl_*.cddl fixtures (probe-supported).

# ---- comment DSL (`; @directive`) — src/comment_ast.rs ----
[[feature]]
id = "dsl.name"
production = "comment_dsl"
alt = "@name"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@name; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@name — explicit field/variant name"
desc = "Overrides the generated name of a map field, array element, or choice variant (e.g. integer-keyed map fields become readable names)."
example = '''
named = [
  bytes, ; @name address
  uint ; @name checksum
]'''

[[feature]]
id = "dsl.rust_name"
production = "comment_dsl"
alt = "@rust_name"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@rust_name; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@rust_name — dependency-pinned Rust type name"
desc = "On a rule in an extern-deps scope (a stub or an extern-interface export), pins the FINAL Rust name the dependency's own codegen version derived, so the consumer reads the name instead of re-deriving it — killing cross-version naming skew. Rejected gracefully on exported rules (the consumer IS the deriving version there); a pin equal to today's derivation changes nothing (plain grouped import), so faithful-stub migration stays byte-identical."
# The example is the CONSUMER side; the directive itself may only appear in an extern-deps scope,
# so the probe generates this as directory input with `example_extern_stub` at
# _CDDL_CODEGEN_EXTERN_DEPS_DIR_/extern_dep/lib.cddl (see verify.ts `setCodegenInput`). The
# generated `use extern_dep::RenamedFoo as Foo;` references a crate that doesn't exist standalone,
# so the row is COMPILE_GATE_EXEMPT (generation exit only), like the other extern-referencing rows.
example = '''
thing = [x: foo, y: uint]'''
example_extern_stub = '''
foo = _CDDL_CODEGEN_EXTERN_TYPE_ ; @rust_name RenamedFoo'''

[[feature]]
id = "dsl.doc"
production = "comment_dsl"
alt = "@doc"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@doc; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@doc — rust doc comment"
desc = "Attaches a rust doc-comment at field, struct, variant, or rule level (plain alias and @newtype rules). Cannot contain '@'."
example = '''
documented = [
  foo: text, ; @doc a field comment
  bar: uint
] ; @doc struct doc
documented_alias = uint ; @doc an alias rule doc'''

[[feature]]
id = "dsl.newtype"
production = "comment_dsl"
alt = "@newtype"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@newtype; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@newtype — wrapper struct instead of alias"
desc = "Turns `foo = uint` from a `type Foo = u64` alias into a `struct Foo(u64)` newtype; may name an optional getter."
example = "protocol_magic = uint ; @newtype"

[[feature]]
id = "dsl.ignore"
production = "comment_dsl"
alt = "@ignore"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@ignore; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@ignore — tolerate-and-drop open struct-map row / array segment"
desc = "The tolerate-and-drop flavor of an open struct-map rest row (`* k => v` after fixed keys) or an open-array occurrence segment (`* t` final, or a safe middle `* t` before one mandatory major-disjoint suffix). Unknown map entries / repeated array elements are typed-deserialized (for maps, key AND value, so the stream advances past nested containers) and then DROPPED: no `rest` field is emitted, serialize re-emits only the declared members, and JSON/schemars/wasm are a closed struct's. This is the documented-lossy counterpart to the default capture flavor (byte round-trips do not hold for wire data carrying unknown entries / ignored array elements). Valid ONLY on a recognized loose `* k => v` rest row or loose final/safe-middle `* t` segment — every other placement (rule/alias/union/table/whole-array/field, unsafe non-final placement, or restricted window) is a graceful rejection — and rejected together with --preserve-encodings (a preserve crate's byte-exact contract can't hold for a lossy type), with @duplicates (no captured container / no keys for a policy to govern), and with @name (no field to name). The directive is bare and argument-less."
example = '''
label_map = {
  1: uint, 2: text,
  * uint => any ; @ignore
}'''

[[feature]]
id = "dsl.no_alias"
production = "comment_dsl"
alt = "@no_alias"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@no_alias; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@no_alias — inline the type, emit no alias"
desc = "Skips generating a named alias for the type; uses the underlying type directly at every use site."
example = '''
inner_alias = uint ; @no_alias
uses = [field: inner_alias]'''

[[feature]]
id = "dsl.used_as_key"
production = "comment_dsl"
alt = "@used_as_key"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@used_as_key; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@used_as_key — force Ord/Hash derives"
desc = "Forces a type to derive Ord/PartialOrd or Hash even if it isn't used as a map key in the spec (so hand-written utility code can key on it)."
example = "keyed = [a: uint, b: text] ; @used_as_key"

[[feature]]
id = "dsl.used_as_key.hash"
production = "comment_dsl"
alt = "@used_as_key hash"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@used_as_key; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@used_as_key hash — narrowed Hash derive family"
desc = "Flavor argument narrowing @used_as_key to the hash family: derives only Hash, Eq, PartialEq (so a downstream HashMap key compiles), mode-independent unlike the bare tag's full mode-dependent bundle. Propagates transitively to contained types."
example = "keyed = [a: uint, b: text] ; @used_as_key hash"

[[feature]]
id = "dsl.used_as_key.ord"
production = "comment_dsl"
alt = "@used_as_key ord"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@used_as_key; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@used_as_key ord — narrowed Ord derive family"
desc = "Flavor argument narrowing @used_as_key to the ord family: derives only Ord, PartialOrd, Eq, PartialEq (so a downstream BTreeMap key compiles), mode-independent unlike the bare tag's full mode-dependent bundle. Propagates transitively to contained types."
example = "keyed = [a: uint, b: text] ; @used_as_key ord"

[[feature]]
id = "dsl.used_as_key.hash_ord"
production = "comment_dsl"
alt = "@used_as_key hash ord"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@used_as_key; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@used_as_key hash ord — union of the hash and ord families"
desc = "Flavor argument combining both narrowed families: derives the union Hash, Ord, PartialOrd, Eq, PartialEq, mode-independent unlike the bare tag whose Hash is mode-dependent. Order of the two words is irrelevant. Propagates transitively to contained types."
example = "keyed = [a: uint, b: text] ; @used_as_key hash ord"

[[feature]]
id = "dsl.used_as_elem"
production = "comment_dsl"
alt = "@used_as_elem"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@used_as_elem; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@used_as_elem — mint the canonical loose-list wasm wrapper"
desc = "Forces minting the loose-list wasm wrapper (FooList = [* foo] equivalent) for the tagged type even when the spec never contains that list inline, so this crate canonically hosts the wrapper class (and satisfies downstream --wrapper-requests consumers asking for that shape)."
example = "elem_host = [a: uint, b: text] ; @used_as_elem"

[[feature]]
id = "dsl.raw_bytes_flavor"
production = "comment_dsl"
alt = "@raw_bytes_flavor"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@raw_bytes_flavor; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@raw_bytes_flavor — extern generic raw-bytes wrapper flavor"
desc = "On a _CDDL_CODEGEN_EXTERN_TYPE_ generic, makes instances whose argument is a _CDDL_CODEGEN_RAW_BYTES_TYPE_ alias the user-owned <ExternName>RawBytes wrapper flavor instead of the plain name (one wrapper type cannot serve both trait-bound and raw-bytes elements — the blanket impls would conflict). Opt-in only, so a wrapper bound solely on RawBytesEncoding keeps compiling under the plain name."
example = "ext_set<T> = _CDDL_CODEGEN_EXTERN_TYPE_ ; @raw_bytes_flavor"

[[feature]]
id = "dsl.copy"
production = "comment_dsl"
alt = "@copy"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@copy; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@copy — extern/raw-bytes type derives Copy, drop boundary clones"
desc = "On a _CDDL_CODEGEN_EXTERN_TYPE_ or _CDDL_CODEGEN_RAW_BYTES_TYPE_ rule, declares that the externally-defined rust type derives Copy, so the generator stops emitting a defensive .clone() at boundaries that move the value (map-key deserialize loops, wasm getters/accessors). The declaring crate emits a compile-time Copy assertion for the type, so a false @copy fails that crate's own build. Rides the extern-interface seam like @raw_bytes_flavor, so --extern-import consumers inherit it. The wasm face (a distinct wrapper) is not Copy, so the wasm->rust boundary keeps its clone."
example = "hash = _CDDL_CODEGEN_RAW_BYTES_TYPE_ ; @copy"

[[feature]]
id = "dsl.duplicates.reject"
production = "comment_dsl"
alt = "@duplicates reject"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@duplicates; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@duplicates reject — duplicate-free set/array collections"
desc = "Per-rule duplicates policy, reject flavor: on a set/array collection rule ([* a] / [+ a], including the tag-258 set idiom) the transparent alias swaps to the order-preserving uniqueness twin OrderedSet/NonEmptyOrderedSet, whose single TryFrom door refuses a duplicate (DeserializeFailure::DuplicateKey) identically on the wire and through the API. Accepted (duplicate-free) input still re-emits byte-exactly — rejection narrows the accepted set, never the accepted bytes. On a table, reject is the default (writing it is an accepted self-documenting no-op). The directive takes exactly one required argument; there is no bare form (a missing/unknown argument is a parse-time panic)."
example = "iset = #6.258([* uint]) / [* uint] ; @duplicates reject"

[[feature]]
id = "dsl.duplicates.preserve"
production = "comment_dsl"
alt = "@duplicates preserve"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@duplicates; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@duplicates preserve — duplicate-preserving pair-map tables"
desc = "Per-rule duplicates policy, preserve flavor: on a table rule ({* k => v}, {+ k => v}, or a bounded homogeneous window) the transparent alias swaps to the Vec<(K, V)>-backed PairMap/NonEmptyPairMap/BoundedPairMap twin — the only shape faithful to both entry order and duplicate keys. BoundedPairMap's single TryFrom door enforces its inclusive entry-count window, so a duplicate-keyed map decodes AND re-emits byte-exactly within the allowed range (driver: pre-Conway Cardano transaction_metadata, whose auxiliary-data hash is computed over the original bytes). JSON diverges to an array of [k, v] pairs (an object would collapse duplicates); under --canonical-form entries stable-sort by encoded key bytes with duplicates adjacent. On a set/array, preserve is the default (writing it is an accepted self-documenting no-op)."
example = "meta = { 2*3 uint => text } ; @duplicates preserve"

[[feature]]
id = "dsl.custom_json"
production = "comment_dsl"
alt = "@custom_json"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@custom_json; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@custom_json — suppress generated JSON traits"
desc = "Avoids generating/deriving JSON-related traits, on the assumption the user supplies their own."
example = "cj = uint ; @newtype @custom_json"

[[feature]]
id = "dsl.no_json_schema_export"
production = "comment_dsl"
alt = "@no_json_schema_export"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@no_json_schema_export; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@no_json_schema_export — not a published JSON-schema root"
desc = "Declares that a rule's rust type is not part of the published JSON-schema surface: under --json-schema-export the json-gen crate's `add_schemas` emits no registration row for it, so it is not one of the crate's declared schema roots. Deliberately narrow — the serde/schemars DERIVES stay (a parent embedding the type still needs them, and the type still appears in the crate's `$defs` whenever a published type references it — the row is the ROOT declaration, not the definition; dropping the derives is the orthogonal, legally combinable @custom_json), and CBOR/wasm/extern-interface output is untouched. Inert when --json-schema-export is off, so one spec generates unedited under several flag sets. Valid on any rule that registers a rust type; on one that registers none (a transparent alias, a generic DEFINITION — only its instantiations are types) there is no row to suppress and generation is rejected by name rather than silently dead."
example = "njse = [a: uint, b: text] ; @no_json_schema_export"

[[feature]]
id = "dsl.custom_serialize"
production = "comment_dsl"
alt = "@custom_serialize"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@custom_serialize; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@custom_serialize — override serialization"
desc = "Replaces generated serialization with a named user function (type-level or field-level)."
example = '''
cb = bytes ; @custom_serialize my_ser @custom_deserialize my_deser
holder = [f: cb]'''

[[feature]]
id = "dsl.custom_deserialize"
production = "comment_dsl"
alt = "@custom_deserialize"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@custom_deserialize; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@custom_deserialize — override deserialization"
desc = "Replaces generated deserialization with a named user function (type-level or field-level)."
example = '''
cb = bytes ; @custom_serialize my_ser @custom_deserialize my_deser
holder = [f: cb]'''

[[feature]]
id = "dsl.custom_encodings"
production = "comment_dsl"
alt = "@custom_encodings"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@custom_serialize / @custom_deserialize (Declaring the wire's encoding variables); src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@custom_encodings — the custom codec declares its own wire's encoding variables"
desc = "Beside a complete @custom_serialize/@custom_deserialize pair, declares the codec-visible encoding variables of the wire THAT CODEC writes and reads, so the preserve-encodings signature and the *Encoding sidecar slots follow the declaration instead of the REPLACED type's inferred demand. A comma-separated list (no whitespace) over sz (Option<cbor_event::Sz>), str (StringEncoding) and len (LenEncoding), positional — serialize takes them as trailing arguments in declared order, deserialize returns (value, declared…) — or the keyword none, the explicit empty list for a wire with no framing. Without it, a pair over a SELF-CARRYING type (an extern, a record, bool, any) infers no variables at all and the custom wire's framing is recorded nowhere, so the round trip silently normalizes it; under --preserve-encodings that undeclared spelling is now a graceful rejection. Requires BOTH halves in the same position (rule or field) and binds to the pair beside it, so a field-level pair never inherits a shadowed alias's declaration. Inert without --preserve-encodings. Aggregate (per-element Vec/BTreeMap) and tag-presence encodings are deliberately not declarable."
example = '''
cb = bytes ; @custom_serialize my_ser @custom_deserialize my_deser @custom_encodings sz,str
holder = [f: cb]'''

[[feature]]
id = "dsl.custom_wire_major"
production = "comment_dsl"
alt = "@custom_wire_major"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §Declaring the wire's major type (@custom_wire_major); src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@custom_wire_major — the custom codec declares which CBOR major type its wire starts with"
desc = "The second member of the wire-facts declaration family beside @custom_encodings. Written beside a complete @custom_serialize/@custom_deserialize pair, declares which of the eight CBOR major types the wire THAT CODEC writes begins with, as exactly one of uint / nint / bytes / text / array / map / tag / simple (an unknown token is a loud parse failure naming the set). Its one consumer is an open table's typed row (t = { * K_t => V_t, * K_r => V_r }), whose entry dispatch peeks the wire major before any deserializer runs: there the generator's own cbor_types() answers about the type the codec REPLACED, so a codec writing hex TEXT over a raw-bytes marker would dispatch major 2 and never match its own keys. REQUIRED at that position (its absence is a graceful rejection naming the directive); a graceful rejection where nothing consumes it, where the pair is incomplete or absent, and on a rule that mints a struct (the declaration is read through the rule's transparent alias entry, which a struct-minting rule has none of). Consumed somewhere is enough, so one alias may key an open table AND appear at a field. Unlike @custom_encodings it is not gated on --preserve-encodings."
example = '''
rb = _CDDL_CODEGEN_RAW_BYTES_TYPE_
rb_v1 = rb ; @custom_serialize my_ser @custom_deserialize my_deser @custom_wire_major text
t = { * rb_v1 => uint, * uint => uint }'''

[[feature]]
id = "dsl.extern_companions"
production = "comment_dsl"
alt = "@extern_companions"
rfc = "cddl-codegen comment DSL; docs/docs/comment_dsl.mdx §@extern_companions; src/comment_ast.rs"
profile = "CDDL_CODEGEN"
title = "@extern_companions — reference a sibling crate's wasm companion classes"
desc = "On a LOCALLY-declared, non-generic _CDDL_CODEGEN_EXTERN_TYPE_ or _CDDL_CODEGEN_RAW_BYTES_TYPE_ rule, declares that the named STRUCTURAL wasm companion classes of that type (its <Name>List, Map<Name>To…, …) already exist in a sibling wasm crate: the generator emits `use <path>::<Class>;` and mints no local #[wasm_bindgen] class of that name, so both crates can link into one cdylib without a duplicate __wbg_<class>_free symbol. Both markers qualify because both name a type this crate does not define while the generator still mints that type's companions under its ident. Argument is `<use_path_prefix>=<Class>[,<Class>…]`, whitespace-free; only LISTED classes defer, so an unlisted companion of the same type still mints locally. The dependency-keyed --extern-wrapper-index / --workspace-dep cannot serve this case (both key on a constituent's owning DEPENDENCY, and a local marker has no dep edge; an index also lists only what generation minted, never a hand-written class), so a dep-scoped rule carrying it is rejected naming those flags. Inert without --wasm."
example = '''
tm = _CDDL_CODEGEN_EXTERN_TYPE_ ; @extern_companions dep_wasm=TmList
holder = [items: [* tm]]'''

# ---- sentinel typenames (magic identifiers, not comments) — src/parsing.rs *_MARKER ----
[[feature]]
id = "ext.extern"
production = "sentinel"
alt = "_CDDL_CODEGEN_EXTERN_TYPE_"
rfc = "cddl-codegen sentinel; docs/docs/comment_dsl.mdx §_CDDL_CODEGEN_EXTERN_TYPE_; src/parsing.rs EXTERN_MARKER"
profile = "CDDL_CODEGEN"
title = "_CDDL_CODEGEN_EXTERN_TYPE_ — compose in a hand-written type"
desc = "Treats the rule as an externally-defined type implementing Serialize/Deserialize; no code is generated for it. (ruby/rust reject the undefined typename — expected for a vendor extension.)"
example = '''
foo = _CDDL_CODEGEN_EXTERN_TYPE_
bar = [x: uint, y: foo]'''

[[feature]]
id = "ext.raw_bytes"
production = "sentinel"
alt = "_CDDL_CODEGEN_RAW_BYTES_TYPE_"
rfc = "cddl-codegen sentinel; docs/docs/comment_dsl.mdx §_CDDL_CODEGEN_RAW_BYTES_TYPE_; src/parsing.rs RAW_BYTES_MARKER"
profile = "CDDL_CODEGEN"
title = "_CDDL_CODEGEN_RAW_BYTES_TYPE_ — bytes with hand-written constraints"
desc = "Encodes as bytes but defers to an external type implementing the RawBytesEncoding trait. (ruby/rust reject the undefined typename — expected.)"
example = '''
rb = _CDDL_CODEGEN_RAW_BYTES_TYPE_
bar = [rb]'''

# ---- intra-alternative variation rows: a GENERIC marker base, with and without instances ----
# The two extern rows below differ in ONE axis — whether the spec binds an instance — and the two
# faces answer it differently, which is why both are enumerated rather than one standing for the
# other: rust names the generic BASE either way (and aliases each instance itself), while the wasm
# face, having no generics, re-exports the bare base when nothing is bound and demands a CONCRETE
# `<Base><Arg>` wrapper as soon as something is. The raw-bytes row below is the same axis on the
# other marker, where the answer is a refusal.

[[feature]]
id = "ext.extern.generic"
production = "sentinel"
alt = "_CDDL_CODEGEN_EXTERN_TYPE_"
rfc = "cddl-codegen sentinel; docs/docs/comment_dsl.mdx §_CDDL_CODEGEN_EXTERN_TYPE_; src/parsing.rs EXTERN_MARKER"
profile = "CDDL_CODEGEN"
title = "_CDDL_CODEGEN_EXTERN_TYPE_ generic base with NO instances — re-export only"
desc = "A generic extern base the spec never instantiates. Nothing is emitted for it beyond the re-export glue naming the bare base (`pub use crate::<Base>;`) in both faces: it names no concrete type, so the extern-interface self-check and the json-gen schema registrar must both SKIP it — a row spelling a bare `<Base>` would be E0107 against the parameterized type the marker declares."
example = '''
ext_gen<T> = _CDDL_CODEGEN_EXTERN_TYPE_
plain = [x: uint]'''

[[feature]]
id = "ext.extern.generic_instance"
production = "sentinel"
alt = "_CDDL_CODEGEN_EXTERN_TYPE_"
rfc = "cddl-codegen sentinel; docs/docs/comment_dsl.mdx §_CDDL_CODEGEN_EXTERN_TYPE_; src/parsing.rs EXTERN_MARKER"
profile = "CDDL_CODEGEN"
title = "_CDDL_CODEGEN_EXTERN_TYPE_ generic base WITH an instance — per-instance alias"
desc = "A generic extern base the spec binds (`ext_gen<uint>`). The rust crate aliases the instance itself (`pub type ExtGenU64 = ExtGen<u64>;`) and re-exports only the BASE, so one hand-written generic definition serves every instance; the wasm crate, which has no generics, instead requires a user-provided concrete `ExtGenU64` wrapper and re-exports THAT name."
example = '''
ext_gen<T> = _CDDL_CODEGEN_EXTERN_TYPE_
holder = [y: ext_gen<uint>]'''

[[feature]]
id = "ext.raw_bytes.generic"
production = "sentinel"
alt = "_CDDL_CODEGEN_RAW_BYTES_TYPE_"
rfc = "cddl-codegen sentinel; docs/docs/comment_dsl.mdx §_CDDL_CODEGEN_RAW_BYTES_TYPE_; src/parsing.rs RAW_BYTES_MARKER"
profile = "CDDL_CODEGEN"
title = "_CDDL_CODEGEN_RAW_BYTES_TYPE_ generic base — refused at parse time"
desc = "The raw-bytes marker's answer to the same generic-base axis the two extern rows above enumerate, and the opposite one: an extern base may legitimately be parameterized (it is an arbitrary hand-written type), but a raw-bytes type IS its own bytes and carries no element type for a parameter to name, so a generic base is refused by name at parse time rather than generating self-check and schema rows spelling a bare base that cannot compile against the parameterized type the marker declares. The remedy the message names is to declare it non-generic. Refused with and without instances, under --wasm=true and --wasm=false alike."
example = '''
rb_gen<T> = _CDDL_CODEGEN_RAW_BYTES_TYPE_
bar = [x: rb_gen<uint>]'''
