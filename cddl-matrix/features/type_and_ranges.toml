# CDDL features — the `type` / `type1` assembly layer (construct + variation axis).
# Covers the productions that sit ABOVE type2 and compose type2 instances together:
#   type    = type1 *(S "/" S type1)            ; type-choice assembly
#   type1   = type2 [S (rangeop / ctlop) S type2] ; range / control-operator application
#   rangeop = "..." / ".."                       ; inclusive / exclusive range
#   ctlop   = "." id                             ; the operator name; APPLIED as `type1 .name type2`
#   assignt = "=" / "/="                         ; incremental type-choice extension (/=)
#   assigng = "=" / "//="                        ; incremental group-choice extension (//=)
#
# Modeling notes (so the row count is justified against the ABNF, not arbitrary):
# - `type` and `type1` each have a single RHS (a sequence with an optional/repeated tail), not an
#   ABNF alternation. Their *no-op* base cases (`type` with no `/`, `type1` with no operator) just
#   delegate to type2 — already enumerated in type2.toml — so they get no row of their own. The
#   distinct constructs these productions INTRODUCE are the choice tail (type) and the rangeop/ctlop
#   slot (type1); those are the rows below.
# - `rangeop` IS a two-way alternation (`..` vs `...`) → one row per alternative.
# - `ctlop` is `"." id`; its "alternatives" are the operator *names*, which are the IANA-derived
#   control-operator axis (reference ids `ctl.*`, authored from sources/cddl-control-operators.csv —
#   NOT re-listed here). So control operators contribute ONE construct row: the application binding.
#
# Schema per [[feature]] matches features/type2.toml exactly:
#   id, production, alt, rfc, profile, title, desc, example, [roles], [encodings].
# (`profile` = the RFC that introduces the construct; default "RFC8610" — see type2.toml.)
# Support status is NOT here — see annotations/cddl_codegen.toml.

# --- type = type1 *(S "/" S type1) ---
[[feature]]
id = "type.choice"
production = "type"
alt = 'type1 *("/" type1)'
rfc = "RFC8610 §2.2.2; ABNF type / type-choice"
profile = "RFC8610"
title = "Type choice (/)"
desc = "Assembles two or more type1 alternatives into a single type with the `/` operator; a value matches if it matches any branch."
# Members steered off `bool`: a `bool` member USED to make the generated choice need type annotations
# (E0282); that is now fixed (the cbor_event 3.x de-generification removed the reader/writer fn generics
# that left the bool arm's type unconstrained) and pinned by `tests/corpus/bool_choice.cddl`. These three
# still isolate the `/` construct itself — `bool` is owned by `bool.cddl`, so a `bool` member here would
# conflate the two constructs — and compile cleanly.
example = "t = uint / tstr / bytes"
roles = ["role.choice-member"]

# --- all-fixed-value type choice -> c-style enum. A serialization-distinct SPECIALIZATION of type.choice:
# when every alternative is a literal value, cddl-codegen emits a discriminated c-style enum (a distinct
# code path), so it's its own feature per the semantic-individuation rule. Same `type` production/alt. ---
[[feature]]
id = "type.enum"
production = "type"
alt = 'type1 *("/" type1)'
rfc = "RFC8610 §2.2.2; ABNF type / type-choice (all-fixed-value specialization)"
profile = "RFC8610"
title = "All-fixed-value type choice (c-style enum)"
desc = "A type choice whose alternatives are all literal values (e.g. `0 / 1 / 2`); cddl-codegen emits a discriminated c-style enum rather than a general type-choice enum."
example = "e = 0 / 1 / 2"

# NOTE: the `T / null` special case is NOT a distinct ABNF alternative — it is the same
# `type = type1 *("/" type1)` production as type.choice, privileged only by consumer behaviour
# (`T / null` -> Option<T>). Per the "master stays pure spec" invariant it is not a feature row;
# the consumer fact is preserved as a note in annotations/cddl_codegen.toml.

# --- rangeop = ".." ---
[[feature]]
id = "rangeop.inclusive"
production = "rangeop"
alt = '".."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"..\""
profile = "RFC8610"
title = "Inclusive range (a..b)"
desc = "Applied inside type1 as `type2 .. type2`; constrains to the closed interval including both endpoints."
example = "t = 0..10"

# --- rangeop head-type × sign variation rows (inclusive) ---
# The base rangeop rows above are verdicted from a uint-headed, non-negative window (`0..10`) alone.
# These specialize the SAME production/alt on the (head-type × sign) axis — the variation that stayed
# invisible until enumerated: because the enforcement axis reaches only as far as row enumeration (the
# "Intra-alternative variation rows" rule, ROADMAP.md),
# a missing row is an enforcement blind spot, which is exactly how the float-range silent-acceptance
# hole hid from the matrix and was caught only by manual probing.
[[feature]]
id = "rangeop.inclusive.int"
production = "rangeop"
alt = '".."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"..\""
profile = "RFC8610"
title = "Inclusive range, signed-int head spanning both CBOR sign arms (a..b)"
desc = "Head-type × sign variation of rangeop.inclusive: a sign-spanning signed-int window (`-10..10`) constrains BOTH CBOR sign arms (uint + nint), exercising the per-arm bound partition. Distinct from the uint-headed base row because the enforcement axis reaches only as far as row enumeration (the \"Intra-alternative variation rows\" rule) — a window that crosses zero is a separate enforcement surface, not implied by `0..10`."
example = "t = -10..10"

[[feature]]
id = "rangeop.inclusive.nint"
production = "rangeop"
alt = '".."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"..\""
profile = "RFC8610"
title = "Inclusive range, all-negative head (uint arm empty) (a..b)"
desc = "Head-type × sign variation of rangeop.inclusive: an all-negative window (`-10..-3`) leaves the uint CBOR sign arm EMPTY (every uint is out of range), exercising the arm-empty reject path. A distinct enforcement surface the uint-headed base row cannot reach, per the \"Intra-alternative variation rows\" lesson that enforcement reaches only as far as row enumeration."
example = "t = -10..-3"

[[feature]]
id = "rangeop.inclusive.float"
production = "rangeop"
alt = '".."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"..\""
profile = "RFC8610"
title = "Inclusive range, float head (a..b)"
desc = "Head-type × sign variation of rangeop.inclusive: a float-headed window (`0.5..10.5`) enforces a dense float interval (NaN-safe, both endpoints included). Its absence as a row is precisely why float-range non-enforcement was silently accepted until manual probing — the \"Intra-alternative variation rows\" lesson that the enforcement axis reaches only as far as row enumeration made concrete."
example = "t = 0.5..10.5"

# --- rangeop = "..." ---
[[feature]]
id = "rangeop.exclusive"
production = "rangeop"
alt = '"..."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"...\""
profile = "RFC8610"
title = "Exclusive range (a...b)"
desc = "Applied inside type1 as `type2 ... type2`; constrains to the half-open interval that excludes the upper endpoint."
example = "t = 0...10"

# --- rangeop head-type × sign variation rows (exclusive) ---
# The exclusive-range twins of the inclusive variation rows above: same (head-type × sign) axis, but on
# the half-open `...` interval whose excluded upper endpoint is its own enforcement surface. Enumerated
# for the same "Intra-alternative variation rows" reason — a variation with no row is an enforcement
# blind spot.
[[feature]]
id = "rangeop.exclusive.int"
production = "rangeop"
alt = '"..."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"...\""
profile = "RFC8610"
title = "Exclusive range, signed-int head spanning both CBOR sign arms (a...b)"
desc = "Head-type × sign variation of rangeop.exclusive: a sign-spanning signed-int window (`-10...10`) constrains BOTH CBOR sign arms with the upper endpoint EXCLUDED. Distinct enforcement surface from the uint-headed base row, per the \"Intra-alternative variation rows\" lesson that enforcement reaches only as far as row enumeration."
example = "t = -10...10"

[[feature]]
id = "rangeop.exclusive.nint"
production = "rangeop"
alt = '"..."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"...\""
profile = "RFC8610"
title = "Exclusive range, all-negative head (uint arm empty) (a...b)"
desc = "Head-type × sign variation of rangeop.exclusive: an all-negative half-open window (`-10...-3`) leaves the uint CBOR sign arm EMPTY and excludes the upper endpoint. A distinct enforcement surface the uint-headed base row cannot reach, per the \"Intra-alternative variation rows\" lesson that enforcement reaches only as far as row enumeration."
example = "t = -10...-3"

[[feature]]
id = "rangeop.exclusive.float"
production = "rangeop"
alt = '"..."'
rfc = "RFC8610 §2.2.2.1; ABNF rangeop / \"...\""
profile = "RFC8610"
title = "Exclusive range, float head (a...b)"
desc = "Head-type × sign variation of rangeop.exclusive: a float-headed half-open window (`0.5...10.5`) enforces a dense float interval with the upper endpoint EXCLUDED (NaN-safe). Enumerated to close the same enforcement blind spot as rangeop.inclusive.float — the \"Intra-alternative variation rows\" lesson that the enforcement axis reaches only as far as row enumeration."
example = "t = 0.5...10.5"

# --- type1 = type2 ctlop type2  (control-operator application) ---
[[feature]]
id = "type1.ctlop"
production = "type1"
alt = "type2 [S (rangeop / ctlop) S type2]"
rfc = "RFC8610 §3.8; ABNF type1 / ctlop (ctlop = \".\" id)"
profile = "RFC8610"
title = "Control-operator application (.op)"
desc = "Binds a target type2 to a controller type2 via a `.name` control operator (`type1 .op type2`). The operator vocabulary is the IANA-derived control-op axis — see reference ids `ctl.*` (e.g. ctl.size, ctl.cbor, ctl.lt); this row is the application construct only, not the operator list."
example = "t = tstr .size 4"

# --- control-op controller-VALUE variation rows (.ne boundary values, .size over uint) ---
# The base `ctl.*` rows (control_examples.toml) probe one controller value per op. These enumerate the
# controller-VALUE variations whose absence is an enforcement blind spot (the "Intra-alternative
# variation rows" rule): the variation axis here
# is the controller value, not an ABNF alternative, so `alt` is omitted — the production resolves to the
# IANA control-op registry (`resolveSource` → control-op). Enumerated per that same lesson that the
# enforcement axis reaches only as far as row/example enumeration, so a boundary the base example misses
# is a blind spot, not just missing coverage.
[[feature]]
id = "ctl.ne.zero"
production = "ne"
rfc = "RFC8610 §3.8.1 / §3.8.4 (control semantics); IANA ctl .ne"
profile = "RFC8610"
title = "Not-equal control at the zero boundary (.ne 0)"
desc = "Controller-value variation of ctl.ne: the excluded value 0, where the sign-partition NE encoding (min>max = exclude min-1, i.e. the pair `(1,-1)`) must route WHOLE to the single CBOR sign arm the excluded value lives in, never split per side. A distinct enforcement surface the base `.ne 5` example cannot reach, per the \"Intra-alternative variation rows\" lesson that enforcement reaches only as far as row enumeration."
example = "x = int .ne 0"

[[feature]]
id = "ctl.ne.one"
production = "ne"
rfc = "RFC8610 §3.8.1 / §3.8.4 (control semantics); IANA ctl .ne"
profile = "RFC8610"
title = "Not-equal control at the one boundary (.ne 1)"
desc = "Controller-value variation of ctl.ne: the excluded value 1, whose degenerate encoding `(2,0)` is the exact class the historical `.ne 1` mis-check hid in — it partitioned `(2,0)` into `x < 2` and wrongly rejected 0 (a closed finding). The Rust-side `sign_bounds` fixtures sweep this boundary; the matrix example did not, and closing that asymmetry is what this row does — per the \"Intra-alternative variation rows\" lesson that enforcement reaches only as far as row enumeration."
example = "x = int .ne 1"

[[feature]]
id = "ctl.size.uint"
production = "size"
rfc = "RFC8610 §3.8.1 / §3.8.4 (control semantics); IANA ctl .size"
profile = "RFC8610"
title = "Size control over a uint target (.size over uint)"
desc = "Target-type variation of ctl.size: `.size` over a `uint` target (window 0..65535), the unswept variant from the uint-target oracle-gap entry (README § \"Upstream oracle gaps\") — the base `ctl.size` example sizes a bstr, so this uint-target form is a distinct enforcement surface. Its reject certification depends on the local-fixes rust oracle (released 0.10.x under-enforces `.size` over uint; the same README gap entry). Enumerated per the \"Intra-alternative variation rows\" lesson that enforcement reaches only as far as row enumeration."
example = "x = uint .size 2"

# --- rule incremental-extension operators (assignt = "=" / "/=", assigng = "=" / "//=") ---
# The base "=" assignment is the ordinary rule form used by every example; the distinct constructs
# these productions introduce are the incremental choice-extension operators "/=" and "//=".

[[feature]]
id = "assignt.extend"
production = "assignt"
alt = '"/="'
rfc = "RFC8610 §3.9; ABNF assignt = \"=\" / \"/=\""
profile = "RFC8610"
title = "Incremental type-choice extension (/=)"
desc = "`name /= type` adds a `/` alternative to an existing (or new) type rule of that name, building a type choice incrementally across multiple rule statements."
example = "a = int\na /= tstr"
roles = ["role.choice-member"]

[[feature]]
id = "assigng.extend"
production = "assigng"
alt = '"//="'
rfc = "RFC8610 §3.9; ABNF assigng = \"=\" / \"//=\""
profile = "RFC8610"
title = "Incremental group-choice extension (//=)"
desc = "`name //= grpent` adds a `//` group-choice branch to an existing (or new) group rule of that name, building a group choice incrementally across multiple rule statements."
example = "tcpopts = (1: int)\ntcpopts //= (2: tstr)"
roles = ["role.choice-member"]
