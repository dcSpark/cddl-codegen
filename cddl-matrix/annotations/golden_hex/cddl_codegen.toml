# cddl-codegen support notes for the CBOR ENCODING axis, keyed by master id.
# This is the NON-DERIVABLE half of tests/golden_hex/COVERAGE.md: the human rationale for why a
# given RFC 8949 Appendix A vector is or isn't exercised by a golden test. The mechanical half
# (covered / uncovered / which test) is DERIVED by project_golden_hex.ts from the actual test bytes;
# this file is joined in to produce the rendered map. Keep consumer judgment here, out of the spec master.
#
# A note keys to EITHER a single vector (`hex`, byte-exact RFC 8949 App. A encoding) OR a whole
# encoding cell (`cell`, an enc.major<N>.<form> id — applies to every vector landing in that cell).
#
# status:
#   redundant     = the encoding PATH (cell) is already covered by another vector; this exact vector
#                   is intentionally not a separate test. (Drift check: the cell MUST be covered.)
#   out_of_scope  = cddl-codegen never emits this encoding under default flags, so there is nothing to
#                   exercise. (Drift check: the cell MUST NOT be covered.)
# Any uncovered vector with NO note here is an UNEXPLAINED gap — the projection flags it.
#
# code_anchor: optional grep-able symbol (NOT a line number) pointing at the generator behavior the
# note describes — same anchor rule as the rest of the matrix.

# ---- redundant: same encoding path as a covered sibling, deliberately not re-tested ----

