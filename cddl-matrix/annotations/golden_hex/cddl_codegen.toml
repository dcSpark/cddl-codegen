# mixed definite-outer / indefinite-inner forms of the same data (App. A lists several encodings per
# value). Outer definite-array path is covered; the indefinite inner item is itself out_of_scope.

[[note]]
hex = "83018202039f0405ff"   # [1, [2,3], [4,5]] with the 3rd element indefinite
status = "redundant"
reason = "outer definite array covered by nested_arrays; embeds an indefinite inner array (see enc.major4.indef, never emitted)"

[[note]]
hex = "83019f0203ff820405"   # [1, [2,3]-indef, [4,5]]
status = "redundant"
reason = "outer definite array covered by nested_arrays; embeds an indefinite inner array (see enc.major4.indef)"

[[note]]
hex = "826161bf61626163ff"   # ["a", {"b":"c"}-indef]
status = "redundant"
reason = "outer definite array covered; embeds an indefinite inner map (see enc.major5.indef, never emitted)"

