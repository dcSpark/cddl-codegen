# ---- major 7 floats: the shortest-form write rule decides which of these the generator emits ----
# A float write is the smallest head that preserves the value (RFC 8949 §4.1). So each Appendix A
# float VALUE has exactly one encoding this suite can assert, and its wider spellings are bytes the
# generator never produces under default flags. The three float cells are covered
# (`float_half` / `float_single` / `float_double`); these notes classify the remainder.

[[note]]
hex = "f90000"   # 0.0
status = "redundant"
reason = "same f16 path (head 0xf9) as 1.5, covered by float_half"

[[note]]
hex = "f90001"   # 5.960464477539063e-08 (smallest subnormal binary16)
status = "redundant"
reason = "same f16 path as 1.5; a subnormal payload is not a distinct generator path"

[[note]]
hex = "f90400"   # 6.103515625e-05 (smallest normal binary16)
status = "redundant"
reason = "same f16 path as 1.5, covered by float_half"

[[note]]
hex = "f93c00"   # 1.0
status = "redundant"
reason = "same f16 path as 1.5, covered by float_half"

[[note]]
hex = "f97bff"   # 65504.0 (largest binary16)
status = "redundant"
reason = "same f16 path as 1.5, covered by float_half"

[[note]]
hex = "f98000"   # -0.0
status = "redundant"
reason = "same f16 path as 1.5; the sign bit is not a distinct generator path"

[[note]]
hex = "f9c400"   # -4.0
status = "redundant"
reason = "same f16 path as 1.5, covered by float_half"

[[note]]
hex = "fa7f7fffff"   # 3.4028234663852886e+38 (largest binary32)
status = "redundant"
reason = "same f32 path (head 0xfa) as 100000.0, covered by float_single"

[[note]]
hex = "fa7f800000"   # Infinity as binary32
status = "out_of_scope"
reason = "Infinity's shortest lossless form is the half `f97c00` (covered by float_infinity), so a write never selects the single-precision spelling; reads accept it"
code_anchor = "smallest_float_sz"

[[note]]
hex = "fa7fc00000"   # NaN as binary32
status = "out_of_scope"
reason = "the canonical quiet NaN's shortest lossless form is the half `f97e00` (covered by float_nan), so a write never selects the single-precision spelling; reads accept it"
code_anchor = "smallest_float_sz"

[[note]]
hex = "faff800000"   # -Infinity as binary32
status = "out_of_scope"
reason = "-Infinity's shortest lossless form is the half `f9fc00` (covered by float_neg_infinity), so a write never selects the single-precision spelling; reads accept it"
