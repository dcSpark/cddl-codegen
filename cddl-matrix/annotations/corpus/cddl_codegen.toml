# cddl-codegen CORPUS coverage overlay — the D3 canonical-fixture mapping (the ✅ authority).
#
# Each [[cover]] asserts: the matrix construct `id` is CANONICALLY isolated by `fixture`
# (tests/corpus/<fixture>). A construct appears INCIDENTALLY in many fixtures (`uint` is in 20, the `[]`
# record wrapper in 18) — the canonical fixture is the one that *isolates* it. That editorial pick is the
# D1-vs-D3 distinction, and it's lifted from tests/corpus/COVERAGE.md's existing calls, not re-derived.
#
# project_corpus.ts drift-checks every entry: featuresIn(<fixture>) MUST contain `id`, so the hand claim
# can't silently rot (rename the fixture or drop the construct and the check fails). Authority model
# mirrors golden_hex: the mechanical half guards the authored half.
#
# SEAM — the drift-check surfaced 7 constructs marked `unsupported` yet touched by a working fixture. On
# investigation they split TWO ways (do NOT just edit the example to make the probe green — that hides gaps):
#  * 3 were DEGENERATE-EXAMPLE artifacts: single-field / mixed maps hit ORTHOGONAL cddl-codegen bugs; the
#    construct itself works. Fixed with minimal feature-isolating examples (memberkey.bareword,
#    occur.optional -> single-field ARRAYS; type2.map -> a table) — now correctly `supported`.
#  * 4 were GENUINE GAPS: top-level fixed-value / null types (`answer = 42`, `x = null`) panic — cddl-codegen
#    only uses Fixed for serialization as a struct member, not as an exposed standalone type. These stay
#    `unsupported`, REPORTED as real gaps (the ➖ notes below), not papered over. The corpus touches them
#    only as MEMBERS — a different aspect; the directional reality the single support-bit can't hold (F3).

