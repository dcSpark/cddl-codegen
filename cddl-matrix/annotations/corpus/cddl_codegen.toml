# ============================================================================================
# NUANCE — the non-derivable half (golden_hex style: status / reason / code_anchor), joined into
# the render. `status` is cross-checked against the matrix support annotation by project_corpus.ts:
#   partial      ⚠️ parsed-but-not-honored — accepted but the semantics aren't modeled. The matrix
#                support MUST be `supported` (it parses/accepts); the note overrides ✅/➕ → ⚠️.
#   unsupported  ➖ — adds the "where to fix" anchor to the matrix's ➖ verdict. Matrix support MUST
#                be `unsupported`/`out_of_profile` (else contradiction).
# `code_anchor` is a grep-able substring (NOT a line number); project_corpus.ts asserts it EXISTS in
# ../src/, so a renamed panic message / removed branch self-invalidates the note (the COVERAGE.md
# evidence rule, made mechanical). Control-operator nuance is deferred to the control-op-support step
# (no per-op support data yet to cross-check `status` against).

# ---- ⚠️ partial — parsed but the semantics aren't honored ----
[[note]]
id = "grpent.inline_group"
status = "partial"
reason = "an inline parenthesized group spliced as an array entry drops all but its FIRST member: `[(uint, tstr)]` generates a 1-field `InlineGroup { index_0: u64 }` (`read_elems(1)`), silently losing the `tstr` (inline_group.cddl snapshot). It parses + compiles (so the matrix probe marks it supported), but the output is wrong — silent data loss. Candidate cddl-codegen fix: inline-group entries aren't flattened into the record."
code_anchor = "GroupEntry::InlineGroup { .. } => None"

[[note]]
id = "rangeop.exclusive"
status = "partial"
reason = "the exclusive upper bound is mis-computed: `a...b` excludes `b` (max valid = b-1), but cddl-codegen emits `max = b+1` — `[v: 0...10]` generates `max: Some(11)`, accepting 10 and 11 which the spec excludes (see exclusive_range.cddl snapshot). It parses + compiles; only the bound is wrong (candidate fix: `range_end + 1` -> `range_end - 1`)."
code_anchor = "range_end + 1"

[[note]]
id = "memberkey.cut"
status = "unsupported"
reason = "explicit cut `^` attaches to a `=>` (Type1) memberkey, which cddl-codegen doesn't support in this form — the example panics. (The IMPLICIT cut on `:`/bareword keys is a separate, supported-but-dropped story — see finding.)"
code_anchor = "Encountered Type1 member key in multi-field map"

