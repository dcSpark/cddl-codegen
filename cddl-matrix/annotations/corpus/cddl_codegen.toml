# ============================================================================================
# NUANCE — the non-derivable half (golden_hex style: status / reason / code_anchor), joined into
# the render. `status` is cross-checked against the matrix support annotation by project_corpus.ts:
#   partial      ⚠️ parsed-but-not-honored — accepted but the semantics aren't modeled. The matrix
#                support MUST be `supported` (it parses/accepts); the note overrides ✅/➕ → ⚠️.
#   unsupported  ➖ — adds the "where to fix" anchor to the matrix's ➖ verdict. Matrix support MUST
#                be `unsupported`/`out_of_profile` (else contradiction).
# `code_anchor` is a grep-able substring (NOT a line number); project_corpus.ts asserts it EXISTS in
# ../src/, so a renamed panic message / removed branch self-invalidates the note (the COVERAGE.md
# evidence rule, made mechanical). Control-operator nuance is deferred to the control-op-support step
# (no per-op support data yet to cross-check `status` against).

[[note]]
id = "memberkey.cut"
status = "partial"
reason = "a literal-key `k ^ => v` routes to the record path as a 1-field struct (the example generates and round-trips), but the cut SEMANTICS (a matched key not being offered to later wildcard entries) is parsed and dropped, exactly like the implicit `:`/bareword cut — a no-op for a closed single-key map, so wire-correct here, but not enforced in general (see finding)."
code_anchor = "Do we need to handle cuts"

[[note]]
id = "assigng.extend"
status = "unsupported"
reason = "incremental group-choice extension (//=) is refused gracefully at generation, in EITHER statement order (the classification keys on the name's whole statement set, not on the repeat's own operator). Honoring it would merge the arms into a plain group rule carrying 2+ group choices — exactly the shape `mark_plain_group` asserts against — so it is blocked on the choice-of-bodies design rather than merely unbuilt; give each arm its own named group and select at the use site (`t = [ grpA // grpB ]`). Its type-side sibling `/=` IS honored: those statements merge into one type-choice rule"
code_anchor = "repeated_rule_definition_rejections"

# ---- ➖ not supported — where the generator gives up (anchors for the boundary) ----
[[note]]
id = "ext.raw_bytes.generic"
status = "unsupported"
reason = "a generic raw-bytes BASE (`foo<T> = _CDDL_CODEGEN_RAW_BYTES_TYPE_`) is rejected by name at parse time: a raw-bytes type is exactly its own bytes and carries no element type a parameter could name, so a parameterized base would emit extern-interface self-check rows and (under --json-schema-export) json-gen registration rows spelling a bare `Foo` — each E0107 against the parameterized type the marker promises, at exit 0 with empty stderr. The remedy the message names is to declare it non-generic. Deliberately the OPPOSITE disposition to a generic EXTERN base (`ext.extern.generic` / `ext.extern.generic_instance`), which names an arbitrary hand-written type that MAY legitimately be parameterized and is therefore recorded-and-skipped by both emitters. Pinned by `generic_raw_bytes_base_rejects_gracefully` and `extern_interface_check_refuses_generic_raw_bytes_base`."
code_anchor = "element type for a parameter to name"

[[note]]
id = "prelude.cbor-any"
status = "unsupported"
reason = "the self-describe tag `#6.55799(any)` marks a byte stream as CBOR — a property of the stream, not of a value a generated struct could hold — so it is rejected gracefully in every position; support is permanently excluded by ruling (`tests/testing-roadmap.toml` § North star). Pinned by `cbor_any_prelude_tag_rejects_gracefully_in_every_position`."
code_anchor = "self-described STREAM marker"

