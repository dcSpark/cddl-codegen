[[record]]
id = "matrix.open-array.optional-adjacency"
title = "Resolve optional fields adjacent to open array tails or open-table rows"

[record.payload]
kind = "work"
body_md = '''### Resolve optional fields adjacent to open array tails or open-table rows

Type-disjoint non-final optionals with generator-proven heads on both sides already decode by peeking
at the next value's major type. A custom-codec or opaque-extern optional/follower/occurrence head is
serialize-only unless mandatory outer framing proves a distinct head. An optional whose proven value
domain overlaps its follower or an open tail/row has no sound discriminator, so that decode surface
remains explicitly refused rather than guessed. RFC 8610 matching is greedy and non-backtracking:
`[? uint, uint]` does not accept `[uint]`, because the optional consumes the item and leaves the
mandatory field absent. A non-empty, major-disjoint middle segment is now a proven separator:
`[? uint, + bytes, uint]` decodes because the required bytes item separates the optional from its
same-major suffix. Its zero-minimum sibling `[? uint, * bytes, uint]` remains a refusal because the
segment can be empty. This work may honor a newly demonstrated,
spec-valid adjacency only when its carrier and lookahead/residue policy preserve those semantics;
intrinsically overlapping spellings remain intentional refusals, not decoder-heuristic work. Any
newly honored shape must prove that boundary through serialization/deserialization and the applicable
Rust, wasm, JSON, component, cross-crate, matrix, and spec-derived-vector surfaces.

'''
work_state = "blocked"
work_intent = "build_capability"
work_kind = "feature"
risk = "invalid_acceptance"
blocker_md = '''The non-empty major-disjoint segment is now a reviewed separator, but no discriminator and residue proof exists for any remaining overlapping optional-adjacency class under greedy non-backtracking matching; overlapping [? uint, uint] remains intentionally refused.
'''

