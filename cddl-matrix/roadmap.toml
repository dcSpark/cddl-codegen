[[record]]
id = "matrix.heterogeneous-array.occurrence-bounds"
title = "Honor the remaining ambiguous/multiple count-permitting occurrences on heterogeneous ARRAY-record fields."

[record.payload]
kind = "work"
body_md = '''### Honor the remaining ambiguous/multiple count-permitting occurrences on heterogeneous ARRAY-record fields.

A final occurrence after fixed members is supported: bare `*` / `0*` uses the loose open-array
`Vec` rest tail, `+` / `1*` uses its `NonEmptyVec` twin with the shipped first-element construction
door, and every other bounded window uses a complete checked `BoundedVec` carrier (including finite,
max-only, min-only, and exact-zero windows). One leading/middle bare-type occurrence may precede an
immediate mandatory, single-item fixed suffix. Variable windows retain the field-codec-free,
effective, CBOR-major-disjoint boundary (`[uint, * bytes, tstr]`): heads are generator-proven or a
transparent custom alias declares its actual wire major. A variable same-major boundary is also
accepted when both untagged generator-owned sides have finite, disjoint fixed-value domains; its
decoder retries only the repeated decoder and rewinds on failure. An exact `N*N` window stops
by count, so `[uint, 2*2 uint, uint]` needs neither a major discriminator nor proven custom-/extern-
owned heads. The decoder therefore obeys RFC 8610 greedy, non-backtracking matching without suffix
speculation; final and safe-middle forms share the
carrier/projection paths covered by `contain.occurrence-target.grpent.member.{zero_array,plus_array,bounded_array}`.
Two or more occurrence members are supported when every member has a unique explicit `@name` and a
finite exact `N*N` window other than `1*1`: each is a separate flat `BoundedVec` and exact count is
its wire boundary, including adjacent and same-major segments.

Still rejected gracefully: variable-cardinality multiple occurrence-bearing members; inline-group and group-choice-arm
occurrences; and plain-group occurrences, including a sole homogeneous `[* pg]` — RFC 8610 repeats
that group by concatenating its member sequence flat, while the ordinary collection carrier would
serialize each group value as a nested array. Supporting it needs a dedicated flat, arity-aware
occurrence carrier rather than `Vec<Pg>`. A variable middle occurrence with an optional, multi-item, undeclared
custom-owned, or direct opaque-extern wire head on its repeated element or suffix, or a same-major suffix
outside the delivered finite fixed-domain class (`[uint, * bytes, bytes]`). A mandatory outer tag or `.cbor` frame supplies a proven wire head and is therefore
admissible even when its inner codec is custom- or extern-owned. Those boundaries are
pinned by `occurrence_on_array_record_field_rejects_gracefully`. Remaining work is the design that can express
variable multiple occurrences and variable-cardinality general same-major boundaries — value-level
discrimination or residue beyond finite fixed domains — without permitting a constructed value to serialize to bytes that do not
deserialize back to it. Any expansion must retain the one-source checked-carrier
construction door and cover serialization, deserialization, every generated projection, matrix
classification, and spec-derived boundary vectors.

'''
work_state = "ready"
work_intent = "build_capability"
work_kind = "feature"
risk = "valid_rejection"
acceptance_md = '''Design invariant-preserving representations and construction doors for multiple or variable-cardinality general same-major heterogeneous repetition (including value-level discrimination or residue beyond finite fixed domains), while retaining RFC 8610 greedy non-backtracking decoding; then cover serialization, deserialization, Rust, wasm, JSON, component, cross-crate, matrix, and spec-derived boundary surfaces as applicable.
'''
priority_band = "high"
priority_rationale_md = '''Variable major-disjoint, exact-count, and finite fixed-domain same-major middle classes are delivered, but spec-valid multiple and general variable same-major repetition still reject. They need an explicit representation rather than a decoder that guesses or speculates on the suffix, so this remains a high-priority language boundary without reopening the delivered shared carrier family.
