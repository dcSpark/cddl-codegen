[[record]]
id = "matrix.derived-variant-naming"
title = "No auto-naming scheme for a DERIVED variant identifier that the fixed-value minter cannot spell — such FLOAT, NINT and keyword-minting TEXT choice arms are refused instead of named."
projection_group = "findings-open"
render_authority = "semantic"
